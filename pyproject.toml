blueprint-run-production-gpu-replenishment-probe = "blueprint_pipeline.production_gpu_replenishment_probe:main"

[project.urls]
Homepage = "https://tryblueprint.io"
Repository = "https://github.com/ognjhunt/BlueprintCapturePipeline.git"
Issues = "https://github.com/ognjhunt/BlueprintCapturePipeline/issues"
Support = "https://github.com/ognjhunt/BlueprintCapturePipeline/issues"
Documentation = "https://github.com/ognjhunt/BlueprintCapturePipeline/blob/main/README.md"
Security = "https://github.com/ognjhunt/BlueprintCapturePipeline/security/policy"
Changelog = "https://github.com/ognjhunt/BlueprintCapturePipeline/blob/main/docs/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/synthesis/test_synthesize.py" = ["E402"]
"tests/test_lightwheel_kitchen_isaac_scenarios.py" = ["E402"]
"tests/test_mujoco_g1_simulator_command.py" = ["E402"]
"tests/test_mujoco_g1_simulator_command_coverage.py" = ["E402"]
"tests/test_native_runtime_service.py" = ["E402"]
"tests/test_scene_wam_policy_episode_packet.py" = ["E402"]
"tests/test_unitree_groot_n17_sonic_vast_persistent_session.py" = ["E402"]
"tests/test_wam_derived_observation_harness.py" = ["E402"]
"tests/test_wam_generated_video_review.py" = ["E402"]

[tool.uv]
required-version = "==0.10.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # PIPE-05 fast lane: heavy subprocess/Isaac/render/module-entrypoint tests are
    # tagged slow/gpu and deselected by default so bare `pytest` is the fast lane.
    # Run everything with `pytest -m ''` (or scripts/pytest_full.sh).
    "-m",
    "not slow and not gpu",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
    "slow: marks slow tests",
]
