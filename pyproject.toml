[project]
name = "blueprint-capture-pipeline"
version = "2.0.0"
description = "Robot-eval package, World Labs preview, and simulation preflight pipeline for Blueprint captures"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Blueprint Team"}]
keywords = [
    "capture",
    "robotics",
    "simulation-preflight",
    "world-labs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # CI installs the matching BlueprintContracts checkout and runs
    # scripts/verify_robot_eval_job_request_contract.py so the
    # robot_eval_job_request.v1 schema cannot fall back silently.
    "blueprint-contracts @ git+https://github.com/ognjhunt/BlueprintContracts.git@7708a4e4c5dedeeb39cc73d3f6869304de295b81",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "fastapi>=0.115.0",
    "json-numpy>=2.1.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "google-auth>=2.0.0",
    "google-cloud-storage>=2.10.0",
    "cryptography>=46.0.5",
    "defusedxml>=0.7.1",
    # Canonical agent harness for the Task Evaluation Supervisor and its
    # specialized agents. Blueprint contracts remain the proof authority.
    "openai-agents>=0.18.1,<0.19",
    "uvicorn>=0.30.0",
    # Explicit uvicorn WebSocket protocol backend for hosted runtime sessions.
    "websockets>=12.0",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-storage>=2.10.0",
    "google-cloud-pubsub>=2.21.0",
    "boto3>=1.34.0",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
]
runtime = [
    "opencv-python-headless>=4.10.0",
    # Optional COLLADA loader discovered by trimesh; no direct package import.
    "pycollada>=0.8",
    "trimesh>=4.4.0",
    "ultralytics>=8.3.0",
]
# No-GPU USD + MuJoCo + mesh validation stack. Pure-CPU wheels: usd-core
# provides the `pxr` bindings used by the dry-render / placement / POV gates,
# mujoco is the preferred CPU parity substrate, and trimesh/pycollada cover
# mesh I/O. Installing this extra makes the full no-GPU validation suite run
# instead of silently skipping. Keep these backend-agnostic (MuJoCo and USD
# are parity backends, not the only ones).
geometry = [
    "usd-core>=24.0",
    "mujoco>=3.1",
    "trimesh>=4.4.0",
    "pycollada>=0.8",
]
llm = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
]
# Compatibility alias retained for existing install commands. The Agents SDK
# is now a core runtime dependency because it is the shared agent harness.
simulation-agents = []
retrieval = [
    "torch>=2.2.0",
    # Retained for upstream vision transforms used by retrieval/model adapters.
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
]
groot-libero = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "lerobot[groot]",
]
# CPU CI validates the LeRobot/GR00T integration contracts but cannot build the
# CUDA-only flash-attn sdist pulled by ``lerobot[groot]``.  Keep that real GPU
# extra above; use the base LeRobot distribution plus its pure-Python model
# surface for hermetic CPU collection/execution.
groot-libero-cpu = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "lerobot>=0.4.4,<0.5",
    "transformers>=4.40.0",
    "peft>=0.14.0",
    "timm>=1.0.0",
    "safetensors>=0.4.0",
    "dm-tree>=0.1.8",
    "ninja>=1.11.0",
    "decord>=0.6.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]
validation = [
    "jsonschema>=4.23.0",
]
dev = [
    "bandit==1.8.6",
    "httpx>=0.28.0",
    "mypy==1.19.1",
    "pip-audit==2.10.1",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.23.0",
    "pycollada>=0.8",
    "ruff>=0.6.0",
    "trimesh>=4.4.0",
    # Full no-GPU validation stack so `uv sync --extra dev` reproduces the
    # canonical CPU interpreter: pxr (usd-core), mujoco, and boto3 are required
    # by the dry-render/placement/parity/object-store tests. Without these the
    # tests silently skip green instead of running (see CRIT-02 / P0-20 / P0-23
    # / P1-42 in docs/archive/point-in-time/cpu-work-audit-2026-06-29.md).
    "usd-core>=24.0",
    "mujoco>=3.1",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "opencv-python-headless>=4.10.0",
    # Real loopback ZMQ transport tests for the official GEAR-SONIC executor
    # (FABLE-004): without pyzmq those tests skip, and the Full Test Lane's
    # fail-closed evidence policy rejects any skip.
    "pyzmq>=26.0",
]

[dependency-groups]
# PEP 735 default dev group. uv installs this group on a plain `uv sync` (no flags),
# so the full no-GPU validation stack (pxr/usd-core, mujoco, trimesh, boto3 + test
# tools) is always present. This closes the footgun where a bare `uv sync` would
# UNINSTALL usd-core/mujoco/trimesh and silently re-break the dry-render / placement /
# parity tests by making them skip green (see CRIT-02 / #5 in
# docs/archive/point-in-time/cpu-work-audit-2026-06-29.md). Mirrors the [project.optional-dependencies] `dev`
# extra so `pip install -e '.[dev]'` stays equivalent for non-uv workflows.
dev = [
    "bandit==1.8.6",
    "httpx>=0.28.0",
    "mypy==1.19.1",
    "pip-audit==2.10.1",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.23.0",
    "pycollada>=0.8",
    "ruff>=0.6.0",
    "trimesh>=4.4.0",
    "usd-core>=24.0",
    "mujoco>=3.1",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "opencv-python-headless>=4.10.0",
    # Real loopback ZMQ transport tests for the official GEAR-SONIC executor
    # (FABLE-004): without pyzmq those tests skip, and the Full Test Lane's
    # fail-closed evidence policy rejects any skip.
    "pyzmq>=26.0",
]

