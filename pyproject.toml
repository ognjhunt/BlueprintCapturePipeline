[project]
name = "blueprint-capture-pipeline"
version = "2.0.0"
description = "Qualification and privacy-safe preview pipeline for Blueprint captures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Blueprint Team"}]
keywords = [
    "site-world",
    "scene-memory",
    "capture",
    "robotics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "blueprint-contracts @ git+https://github.com/ognjhunt/BlueprintContracts.git@9c076bd812a7b3530ac2fa1312d6e0dfa74eb21b",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "fastapi>=0.115.0",
    "google-cloud-storage>=2.10.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-storage>=2.10.0",
]
runtime = [
    "opencv-python-headless>=4.10.0",
    "trimesh>=4.4.0",
    "ultralytics>=8.3.0",
]
llm = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
]
retrieval = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
]
validation = [
    "jsonschema>=4.23.0",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
blueprint-capture-pipeline = "blueprint_pipeline.capture_orchestrator:main"
blueprint-preflight-capture = "blueprint_pipeline.preflight_capture:main"
blueprint-agent-review = "blueprint_pipeline.agent_review_cli:main"
blueprint-run-e2e = "blueprint_pipeline.run_e2e:main"
blueprint-build-object-index = "blueprint_pipeline.object_index_stage:main"
blueprint-sync-skills = "blueprint_pipeline.agent_runtime.skill_sync:main"
blueprint-build-object-geometry = "blueprint_pipeline.object_geometry_stage:main"
blueprint-build-evaluation-prep = "blueprint_pipeline.evaluation_prep_stage:main"
blueprint-video-to-world-runner = "blueprint_pipeline.video_to_world_runner_service:main"
blueprint-native-runtime-service = "blueprint_pipeline.native_runtime_service:main"
blueprint-cosmos-vast-train = "blueprint_pipeline.synthesis.cosmos_vast_training_wrapper:main"
blueprint-run-city-launch-harness = "blueprint_pipeline.city_launch_autonomy_harness:main"

[project.urls]
Repository = "https://github.com/ognjhunt/BlueprintCapturePipeline.git"
Issues = "https://github.com/ognjhunt/BlueprintCapturePipeline/issues"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
    "slow: marks slow tests",
]
