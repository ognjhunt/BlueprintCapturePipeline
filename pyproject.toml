[project]
name = "blueprint-capture-pipeline"
version = "2.0.0"
description = "Robot-eval package, World Labs preview, and simulation preflight pipeline for Blueprint captures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Blueprint Team"}]
keywords = [
    "capture",
    "robotics",
    "simulation-preflight",
    "world-labs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "blueprint-contracts @ git+https://github.com/ognjhunt/BlueprintContracts.git@9c076bd812a7b3530ac2fa1312d6e0dfa74eb21b",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "fastapi>=0.115.0",
    "google-cloud-storage>=2.10.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-storage>=2.10.0",
    "boto3>=1.34.0",
]
runtime = [
    "opencv-python-headless>=4.10.0",
    "trimesh>=4.4.0",
    "ultralytics>=8.3.0",
]
llm = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
]
simulation-agents = [
    "openai-agents>=0.3.0",
]
retrieval = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
]
validation = [
    "jsonschema>=4.23.0",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
blueprint-capture-pipeline = "blueprint_pipeline.capture_orchestrator:main"
blueprint-preflight-capture = "blueprint_pipeline.preflight_capture:main"
blueprint-agent-review = "blueprint_pipeline.agent_review_cli:main"
blueprint-run-e2e = "blueprint_pipeline.run_e2e:main"
blueprint-build-object-index = "blueprint_pipeline.object_index_stage:main"
blueprint-sync-skills = "blueprint_pipeline.agent_runtime.skill_sync:main"
blueprint-build-object-geometry = "blueprint_pipeline.object_geometry_stage:main"
blueprint-build-evaluation-prep = "blueprint_pipeline.evaluation_prep_stage:main"
blueprint-backfill-site-reference-db = "blueprint_pipeline.site_reference_backfill:main"
blueprint-run-city-launch-harness = "blueprint_pipeline.city_launch_autonomy_harness:main"
blueprint-build-robot-eval-dataset = "blueprint_pipeline.robot_eval_dataset:main"
blueprint-run-simulation-automation = "blueprint_pipeline.simulation_automation:main"
blueprint-run-site-eval-director = "blueprint_pipeline.site_eval_director:main"
blueprint-run-robot-eval-job = "blueprint_pipeline.robot_eval_job_orchestrator:main"
blueprint-run-robot-eval-worker = "blueprint_pipeline.robot_eval_worker:main"
blueprint-run-gpu-provider-launcher = "blueprint_pipeline.robot_eval_provider_launcher:main"
blueprint-run-runpod-provider-adapter = "blueprint_pipeline.runpod_provider_adapter:main"
blueprint-audit-robot-eval-startup-architecture = "blueprint_pipeline.robot_eval_startup_architecture_audit:main"
blueprint-ingest-arena-results = "blueprint_pipeline.arena_result_ingest:main"
blueprint-audit-arena-package = "blueprint_pipeline.arena_package_audit:main"
blueprint-smoke-arena-package-local = "blueprint_pipeline.arena_fixture_smoke:main"
blueprint-audit-live-pipeline-setup = "blueprint_pipeline.live_pipeline_setup:main"
blueprint-run-live-pipeline-control-plane = "blueprint_pipeline.live_pipeline_control_plane:main"
blueprint-audit-live-pipeline-proof-boundary = "blueprint_pipeline.live_pipeline_proof_audit:main"
blueprint-audit-live-robot-eval-closure = "blueprint_pipeline.live_robot_eval_closure:main"
blueprint-intake-live-pipeline-inputs = "blueprint_pipeline.live_pipeline_input_intake:main"
blueprint-live-pipeline-intake-service = "blueprint_pipeline.live_pipeline_intake_service:main"
blueprint-label-rollout-vision-openai = "blueprint_pipeline.rollout_vision_label_openai:main"
blueprint-deliver-arena-package-local = "blueprint_pipeline.arena_package_delivery_local:main"
blueprint-build-post-training-data-package = "blueprint_pipeline.post_training_data_package:main"
blueprint-build-capture-batch-registry = "blueprint_pipeline.capture_batch_registry:main"
blueprint-build-scene-asset-preflight = "blueprint_pipeline.scene_asset_preflight:main"
blueprint-build-episode-specs = "blueprint_pipeline.episode_spec:main"
blueprint-run-cpu-simulator-preflight = "blueprint_pipeline.cpu_simulator_preflight:main"
blueprint-materialize-worldlabs-assets = "blueprint_pipeline.worldlabs_asset_materialization:main"
blueprint-build-palatial-physready = "blueprint_pipeline.palatial_physready:main"
blueprint-validate-provider-preview-packet = "blueprint_pipeline.provider_preview_qa:main"
blueprint-build-production-handoff-readiness = "blueprint_pipeline.production_handoff_readiness:main"
blueprint-audit-first-gpu-e2e-readiness = "blueprint_pipeline.first_gpu_e2e_readiness:main"
blueprint-run-owner-gpu-proof = "blueprint_pipeline.owner_gpu_proof_runner:main"
blueprint-write-owner-gpu-default-smoke-artifacts = "blueprint_pipeline.owner_gpu_default_smoke_artifacts:main"
blueprint-build-first-gpu-run-packet = "blueprint_pipeline.first_gpu_run_packet:main"
blueprint-audit-first-gpu-candidates = "blueprint_pipeline.first_gpu_candidate_audit:main"
blueprint-audit-first-gpu-sample-video = "blueprint_pipeline.first_gpu_sample_video_preflight:main"
blueprint-stage-first-gpu-sample-video = "blueprint_pipeline.first_gpu_sample_video_stage:main"
blueprint-audit-first-gpu-cross-repo-readiness = "blueprint_pipeline.cross_repo_first_gpu_readiness:main"

[project.urls]
Repository = "https://github.com/ognjhunt/BlueprintCapturePipeline.git"
Issues = "https://github.com/ognjhunt/BlueprintCapturePipeline/issues"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
    "slow: marks slow tests",
]
