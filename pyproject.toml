[project]
name = "blueprint-capture-pipeline"
version = "2.0.0"
description = "NuRec-first swappable asset orchestration for BlueprintCapture descriptors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Blueprint Team"}]
keywords = [
    "nurec",
    "isaac-sim",
    "digital-twin",
    "asset-swapping",
    "robotics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "trimesh>=4.4.0",
    "open3d>=0.18.0",
    "pybullet>=3.2.6",
    "google-cloud-storage>=2.10.0",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-storage>=2.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
blueprint-capture-swap = "blueprint_pipeline.swap_orchestrator:main"

[project.urls]
Repository = "https://github.com/ognjhunt/BlueprintCapturePipeline.git"
Issues = "https://github.com/ognjhunt/BlueprintCapturePipeline/issues"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: marks integration tests",
]
