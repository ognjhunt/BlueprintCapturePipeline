[project]
name = "blueprint-capture-pipeline"
version = "2.0.0"
description = "Qualification-first capture orchestration with explicit advanced geometry escalation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Blueprint Team"}]
keywords = [
    "nurec",
    "isaac-sim",
    "digital-twin",
    "asset-swapping",
    "robotics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "trimesh>=4.4.0",
    "google-cloud-storage>=2.10.0",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-storage>=2.10.0",
]
geometry = [
    "open3d>=0.18.0",
]
sim = [
    "pybullet>=3.2.6",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
blueprint-capture-swap = "blueprint_pipeline.swap_orchestrator:main"
blueprint-capture-pipeline = "blueprint_pipeline.capture_orchestrator:main"
blueprint-preflight-capture = "blueprint_pipeline.preflight_capture:main"
blueprint-agent-review = "blueprint_pipeline.agent_review_cli:main"
blueprint-run-e2e = "blueprint_pipeline.run_e2e:main"
blueprint-build-object-index = "blueprint_pipeline.object_index_stage:main"
blueprint-sync-skills = "blueprint_pipeline.agent_runtime.skill_sync:main"
blueprint-adapt-interiorgs = "blueprint_pipeline.interiorgs_phase2_adapter:main"
blueprint-interiorgs-phase2-summary = "blueprint_pipeline.interiorgs_phase2_summary:main"
blueprint-build-object-geometry = "blueprint_pipeline.object_geometry_stage:main"
blueprint-build-evaluation-prep = "blueprint_pipeline.evaluation_prep_stage:main"
blueprint-build-simready = "blueprint_pipeline.simready_stage:main"

[project.urls]
Repository = "https://github.com/ognjhunt/BlueprintCapturePipeline.git"
Issues = "https://github.com/ognjhunt/BlueprintCapturePipeline/issues"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
    "slow: marks slow tests",
]
