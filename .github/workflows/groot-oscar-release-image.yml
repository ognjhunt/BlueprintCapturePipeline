name: GR00T OSCAR release image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/docker/robot_eval_worker/groot_oscar_closed_loop/**
      - scripts/build_push_groot_oscar_closed_loop_image.sh
      - src/blueprint_pipeline/groot_oscar_closed_loop_image.py
      - src/blueprint_pipeline/oscar_isaac_closed_loop_eval.py
      - src/blueprint_pipeline/isaac_persistent_task_executor_service.py
      - src/blueprint_pipeline/isaac_runtime_task_backend.py
      - src/blueprint_pipeline/gear_sonic_controller_fk_adapter.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: groot-oscar-release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-once:
    runs-on: [self-hosted, linux, x64, blueprint-image-builder]
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Admit disk before build and registry scan
        run: |
          set -euo pipefail
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge $((300 * 1024 * 1024))

      - name: Materialize ephemeral checkpoint credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/blueprint-secrets"
          printf '%s' "$HF_TOKEN" > "$RUNNER_TEMP/blueprint-secrets/hf_token"
          chmod 0600 "$RUNNER_TEMP/blueprint-secrets/hf_token"

      - name: Authenticate immutable image registry
        env:
          REGISTRY_USERNAME: ${{ secrets.GROOT_OSCAR_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.GROOT_OSCAR_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/blueprint-docker"
          install -d -m 0700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_PASSWORD" \
            | docker login docker.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build, attest, push, registry-scan, and validate once
        env:
          BLUEPRINT_GROOT_OSCAR_CLOSED_LOOP_IMAGE_REF: ${{ vars.GROOT_OSCAR_IMAGE_REPOSITORY }}:${{ github.sha }}-cu128-amd64
          BLUEPRINT_GROOT_OSCAR_CLOSED_LOOP_HF_TOKEN_FILE: ${{ runner.temp }}/blueprint-secrets/hf_token
          BLUEPRINT_ALLOW_GROOT_OSCAR_CLOSED_LOOP_IMAGE_PUSH: "true"
          BLUEPRINT_GROOT_OSCAR_CLOSED_LOOP_MIN_FREE_GIB: "300"
          DOCKER_CONFIG: ${{ runner.temp }}/blueprint-docker
        run: ./scripts/build_push_groot_oscar_closed_loop_image.sh

      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: groot-oscar-release-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            output/groot_oscar_closed_loop_image_manifest.json
            output/groot_oscar_closed_loop_registry_manifest_diagnostic.json
            output/groot_oscar_closed_loop_runtime_smoke.json
            output/groot_oscar_closed_loop_disk_admission.json
            output/groot_oscar_closed_loop_sbom.spdx.json
            output/groot_oscar_closed_loop_provenance.json
            output/groot_oscar_closed_loop_layer_report.json
            output/groot_oscar_closed_loop_buildkit_sbom_attestation.json
            output/groot_oscar_closed_loop_buildkit_provenance_attestation.json

      - name: Remove ephemeral credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/blueprint-secrets" "$RUNNER_TEMP/blueprint-docker"
