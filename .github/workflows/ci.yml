name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Determine changed test surface
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      requires_full_suite: ${{ steps.plan.outputs.requires_full_suite }}
      selected_test_count: ${{ steps.plan.outputs.selected_test_count }}
      native_feature_required: ${{ steps.native-plan.outputs.required }}
      native_scene_required: ${{ steps.native-scene-plan.outputs.required }}
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Build deterministic impact plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m blueprint_pipeline.impacted_test_selection \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --no-worktree \
            --plan-only \
            --plan-output "${{ runner.temp }}/blueprint-ci/impacted-test-plan.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Require native Linux proof when its acceptance test is selected
        id: native-plan
        env:
          IMPACT_PLAN: ${{ runner.temp }}/blueprint-ci/impacted-test-plan.json
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          plan = json.loads(Path(os.environ["IMPACT_PLAN"]).read_text())
          selected = plan["selected_tests"]
          assert isinstance(selected, list) and all(isinstance(row, str) for row in selected)
          changed = plan["changed_files"]
          assert isinstance(changed, list) and all(isinstance(row, str) for row in changed)
          native_tests = {"tests/test_registered_feature_linux.py", "tests/test_legacy_owner_linux.py",
                          "tests/test_historical_generation_linux.py"}
          required = bool(native_tests.intersection(changed)) or any(row.split("::", 1)[0] in native_tests for row in selected)
          native_sources = {"src/blueprint_pipeline/control_plane_lane_disk_diagnostic.py",
                            "src/blueprint_pipeline/control_plane_lane_experiment_archive.py",
                            "src/blueprint_pipeline/s3_compatible_transport.py"}
          required = required or bool(native_sources.intersection(changed))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("required=" + str(required).lower() + "\n")
          PYTHON

      - name: Require real scene startup proof when its feature changes
        id: native-scene-plan
        env:
          IMPACT_PLAN: ${{ runner.temp }}/blueprint-ci/impacted-test-plan.json
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          plan = json.loads(Path(os.environ["IMPACT_PLAN"]).read_text())
          selected, changed = plan["selected_tests"], plan["changed_files"]
          assert all(isinstance(rows, list) and all(isinstance(row, str) for row in rows) for rows in (selected, changed))
          required = any("scene_retirement" in row or row == "deploy/operator-door/door-scene-lifecycle.sh" for row in changed)
          required = required or any(row.split("::", 1)[0] == "tests/test_scene_retirement_linux.py" for row in selected)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("required=" + str(required).lower() + "\n")
          PYTHON

      - name: Upload impact plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impacted-test-plan-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-ci/impacted-test-plan.json
          if-no-files-found: error
          retention-days: 7

  impacted-tests:
    name: Impacted tests and sentinels
    needs: impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI runners are ephemeral; never use the checkout as a durable artifact cache.
      BLUEPRINT_ALLOW_REPO_OUTPUT: "0"
      BLUEPRINT_ALLOW_LARGE_ARTIFACTS: "0"
      CONTRACTS_REPOSITORY: ognjhunt/BlueprintContracts
      # Keep this aligned with the blueprint-contracts pin in pyproject.toml.
      CONTRACTS_REF: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
      CONTRACTS_TOKEN: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}
    steps:
      - name: Bind ephemeral artifact roots
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "BLUEPRINT_ARTIFACT_CACHE_ROOT=${RUNNER_TEMP}/blueprint-artifact-cache" >> "${GITHUB_ENV}"
          printf '%s\n' "BLUEPRINT_EVIDENCE_ROOT=${RUNNER_TEMP}/blueprint-evidence" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Checkout BlueprintContracts
        shell: bash
        run: |
          set -euo pipefail
          git init BlueprintContracts
          cd BlueprintContracts
          git remote add origin "https://x-access-token:${CONTRACTS_TOKEN}@github.com/${CONTRACTS_REPOSITORY}.git"
          fetch_ref="${CONTRACTS_REF:-main}"
          if git fetch --depth=1 origin "${fetch_ref}"; then
            echo "Using BlueprintContracts ref ${fetch_ref}."
          else
            echo "::error::BlueprintContracts ref '${fetch_ref}' was not available. Push a matching Contracts branch/ref or set CONTRACTS_REF; refusing to validate against an implicit fallback."
            exit 1
          fi
          git checkout --detach FETCH_HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install portable review-video toolchain
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # The review-video tests need ffmpeg/ffprobe on PATH -- nothing more.
          # These runners do not ship them, and Ubuntu's apt mirrors have now
          # cost this repository three distinct outages in one night: a hung
          # connection, a drip-feeding package fetch, and an index download
          # that stalled for eleven minutes. No timeout or retry policy fixes
          # a mirror that is slow rather than broken, so the mirror is no
          # longer on this path at all.
          #
          # Use versioned GitHub release assets rather than an expiring daily
          # build or a mirror that serves inconsistent bytes to Actions runners.
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "media toolchain already present: $(ffmpeg -version | head -n1)"
            exit 0
          fi
          FFMPEG_RELEASE="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1"
          download_verified() {
            local name="$1" expected="$2" destination="${RUNNER_TEMP}/$1"
            for attempt in 1 2 3; do
              rm -f "${destination}"
              if curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 420 \
                -o "${destination}" "${FFMPEG_RELEASE}/${name}" \
                && echo "${expected}  ${destination}" | sha256sum -c -; then
                return 0
              fi
              echo "${name} attempt ${attempt} failed byte verification"
            done
            return 1
          }
          download_verified ffmpeg-linux-x64.gz bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
          download_verified ffprobe-linux-x64.gz 25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067
          gzip -dc "${RUNNER_TEMP}/ffmpeg-linux-x64.gz" > "${RUNNER_TEMP}/ffmpeg"
          gzip -dc "${RUNNER_TEMP}/ffprobe-linux-x64.gz" > "${RUNNER_TEMP}/ffprobe"
          sudo install -m 0755 "${RUNNER_TEMP}/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m 0755 "${RUNNER_TEMP}/ffprobe" /usr/local/bin/ffprobe
          ffmpeg -version | head -n1

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra policy_model_cpu
          uv pip install -e BlueprintContracts
          # Native camera/lifecycle rehearsals use real tensors on this CPU
          # runner. Keep the CUDA runtime out of the ordinary PR dependency set.
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0

      - name: Install isolated daily research SDK for wire proof
        if: hashFiles('tools/daily_research/requirements.txt') != ''
        run: |
          uv venv "${RUNNER_TEMP}/daily-research-sdk-proof" --python 3.12
          uv pip install --python "${RUNNER_TEMP}/daily-research-sdk-proof/bin/python" \
            -r tools/daily_research/requirements.txt pytest==9.1.1
          printf '%s\n' "BLUEPRINT_RESEARCH_SDK_PYTHON=${RUNNER_TEMP}/daily-research-sdk-proof/bin/python" >> "${GITHUB_ENV}"

      - name: Verify approved CPU model runner with real inference
        run: |
          uv run --no-sync python -c 'import onnx, onnxruntime; assert onnx.__version__ == "1.23.0"; assert onnxruntime.__version__ == "1.30.0"'
          uv run --no-sync python -m pytest tests/test_policy_model_onnx.py -q

      - name: Run impacted tests and always-on sentinels
        run: |
          uv run --no-sync python -m blueprint_pipeline.impacted_test_selection \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --no-worktree \
            --timeout-seconds 480 \
            --plan-output "${{ runner.temp }}/blueprint-ci/impacted-test-plan.json" \
            --junit "${{ runner.temp }}/blueprint-ci/impacted-tests-junit.xml"

      - name: Upload impacted test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impacted-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blueprint-ci/impacted-test-plan.json
            ${{ runner.temp }}/blueprint-ci/impacted-tests-junit.xml
          if-no-files-found: error
          retention-days: 7

  native-scene-linux:
    name: Real protected scene startup on Linux
    needs: impact
    if: needs.impact.outputs.native_scene_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BLUEPRINT_DISPOSABLE_LINUX_TEST: "1"
    steps:
      - name: Checkout exact feature sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"

      - name: Checkout exact locked native Contracts input
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ognjhunt/BlueprintContracts
          ref: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
          token: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}
          path: BlueprintContractsNative
          persist-credentials: false

      - name: Bind exact nonsecret locked native inputs
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git -C BlueprintContractsNative rev-parse HEAD)" = 7708a4e4c5dedeeb39cc73d3f6869304de295b81
          printf '%s\n' "BLUEPRINT_NATIVE_SOURCE_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          printf '%s\n' "BLUEPRINT_NATIVE_SOURCE_COMMIT=${EXPECTED_SOURCE}" >> "${GITHUB_ENV}"
          printf '%s\n' "BLUEPRINT_NATIVE_CONTRACTS_ROOT=${GITHUB_WORKSPACE}/BlueprintContractsNative" >> "${GITHUB_ENV}"

      - name: Prepare the disposable systemd proof runner
        run: |
          set -euo pipefail
          sudo -n true
          test "$(sudo -n readlink -f /proc/1/exe)" = /usr/lib/systemd/systemd
          test -f /sys/fs/cgroup/cgroup.controllers
          uv venv --python /usr/bin/python3 "${RUNNER_TEMP}/scene-proof-venv"
          # The proof runner imports stdlib/pytest only. The enabled case
          # acquires the exact locked CPU service SDK separately under actual
          # isolated system Python/root ownership; no user-venv SDK is copied.
          uv pip install --python "${RUNNER_TEMP}/scene-proof-venv/bin/python" pytest==9.1.1

      - name: Prove the actual installed bootstrap and credential drop
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/scene-native-evidence"
          mkdir -p "$evidence"
          test_temp="$(mktemp -d "${RUNNER_TEMP}/scene-native-tests.XXXXXX")"
          trap 'rm -rf -- "$test_temp"' EXIT
          "${RUNNER_TEMP}/scene-proof-venv/bin/python" -m pytest --noconftest \
            tests/test_scene_retirement_linux.py::test_actual_default_off_root_bootstrap_drops_blueprint_uid_and_all_caps \
            tests/test_scene_retirement_linux.py::test_actual_locked_system_sdk_current_selection_and_enabled_service_imports \
            -m 'slow or not slow' --basetemp="$test_temp" \
            -o junit_logging=all -o junit_log_passing_tests=true \
            --junitxml="$evidence/native-junit.xml" -q
          "${RUNNER_TEMP}/scene-proof-venv/bin/python" - "$evidence/native-junit.xml" <<'PYTHON'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          assert len(cases) == 2, "both exact native startup selectors must execute"
          assert {case.attrib["name"] for case in cases} == {"test_actual_default_off_root_bootstrap_drops_blueprint_uid_and_all_caps", "test_actual_locked_system_sdk_current_selection_and_enabled_service_imports"}
          assert not any(case.find(tag) is not None for case in cases for tag in ("skipped", "error", "failure")), "a skip/refusal is not native startup proof"
          PYTHON

      - name: Retain actual native startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scene-native-linux-${{ github.sha }}
          path: ${{ runner.temp }}/scene-native-evidence/native-junit.xml
          if-no-files-found: error
          retention-days: 7

  native-feature-linux:
    name: Real registered scratch and cache on Linux
    needs: impact
    if: needs.impact.outputs.native_feature_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BLUEPRINT_DISPOSABLE_LINUX_TEST: "1"
      # The privileged loader requires protected ancestry. Runner /opt can be
      # 0777 even when the interpreter itself is sealed root-owned.
      UV_PROJECT_ENVIRONMENT: /var/lib/blueprint-native-test-venv
    steps:
      - name: Checkout exact feature sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned BlueprintContracts
        env:
          CONTRACTS_TOKEN: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git init BlueprintContracts
          git -C BlueprintContracts remote add origin "https://x-access-token:${CONTRACTS_TOKEN}@github.com/ognjhunt/BlueprintContracts.git"
          git -C BlueprintContracts fetch --depth=1 origin 7708a4e4c5dedeeb39cc73d3f6869304de295b81
          git -C BlueprintContracts checkout --detach FETCH_HEAD

      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"

      - name: Install portable review-video toolchain
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # The review-video tests need ffmpeg/ffprobe on PATH -- nothing more.
          # These runners do not ship them, and Ubuntu's apt mirrors have now
          # cost this repository three distinct outages in one night: a hung
          # connection, a drip-feeding package fetch, and an index download
          # that stalled for eleven minutes. No timeout or retry policy fixes
          # a mirror that is slow rather than broken, so the mirror is no
          # longer on this path at all.
          #
          # Use versioned GitHub release assets rather than an expiring daily
          # build or a mirror that serves inconsistent bytes to Actions runners.
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "media toolchain already present: $(ffmpeg -version | head -n1)"
            exit 0
          fi
          FFMPEG_RELEASE="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1"
          download_verified() {
            local name="$1" expected="$2" destination="${RUNNER_TEMP}/$1"
            for attempt in 1 2 3; do
              rm -f "${destination}"
              if curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 420 \
                -o "${destination}" "${FFMPEG_RELEASE}/${name}" \
                && echo "${expected}  ${destination}" | sha256sum -c -; then
                return 0
              fi
              echo "${name} attempt ${attempt} failed byte verification"
            done
            return 1
          }
          download_verified ffmpeg-linux-x64.gz bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
          download_verified ffprobe-linux-x64.gz 25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067
          gzip -dc "${RUNNER_TEMP}/ffmpeg-linux-x64.gz" > "${RUNNER_TEMP}/ffmpeg"
          gzip -dc "${RUNNER_TEMP}/ffprobe-linux-x64.gz" > "${RUNNER_TEMP}/ffprobe"
          sudo install -m 0755 "${RUNNER_TEMP}/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m 0755 "${RUNNER_TEMP}/ffprobe" /usr/local/bin/ffprobe
          ffmpeg -version | head -n1

      - name: Install and protect real system-Python dependencies
        run: |
          set -euo pipefail
          sudo -n true
          manager="$(sudo -n readlink -f /proc/1/exe)"
          printf 'PID 1 executable: %s\n' "$manager"
          test "$manager" = /usr/lib/systemd/systemd
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /var/lib/blueprint-native-test-venv
          uv venv --python /usr/bin/python3 /var/lib/blueprint-native-test-venv
          uv lock --check
          # Privileged SDK imports reject aliases to a user-owned package cache.
          # Give this root-sealed disposable distribution independent inodes.
          uv sync --frozen --extra dev --python /usr/bin/python3 --link-mode copy
          uv pip install --python /var/lib/blueprint-native-test-venv/bin/python --link-mode copy ./BlueprintContracts
          uv pip install --python /var/lib/blueprint-native-test-venv/bin/python --link-mode copy --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          # ProtectHome hides /home/runner from the actual different-UID child.
          # Seal only this new disposable interpreter, with a root-owned base.
          sudo chown -hR root:root /var/lib/blueprint-native-test-venv

      - name: Prove actual root and ordinary-UID lifecycle
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/blueprint-native-evidence"
          mkdir -p "$evidence"
          test_temp="$(mktemp -d "${RUNNER_TEMP}/blueprint-native-tests.XXXXXX")"
          trap 'rm -rf -- "$test_temp"' EXIT
          /var/lib/blueprint-native-test-venv/bin/python -m pytest \
            tests/test_registered_feature_linux.py::test_actual_registered_disk_diagnostic_delete_offload_and_restore \
            tests/test_historical_generation_linux.py::test_actual_connected_historical_interruption \
            tests/test_registered_feature_linux.py::test_actual_root_blueprint_uid_cache_lifetime_and_revoke \
            tests/test_registered_feature_linux.py::test_actual_contained_blueprint_native_pair_child_and_kernel_completion \
            tests/test_legacy_owner_linux.py::test_actual_legacy_owner_door_privilege_and_revocation \
            tests/test_historical_generation_linux.py::test_actual_historical_target_only_write_and_foreign_reference_visibility \
            tests/test_historical_generation_linux.py::test_actual_private_restore_member_permission_interruption \
            tests/test_historical_generation_linux.py::test_actual_installed_historical_gc_default_off_delete_and_second_tick \
            tests/test_historical_generation_linux.py::test_actual_installed_historical_gc_offload_and_restore \
            -m 'slow or not slow' --basetemp="$test_temp" \
            --maxfail=1 --junitxml="$evidence/native-junit.xml" -q
          /var/lib/blueprint-native-test-venv/bin/python - "$evidence/native-junit.xml" <<'PYTHON'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          assert len(cases) == 46, "all original boundaries, admitted escaped paths and maximum-depth restore, private-prefix, split-publication, unfinished-owner reconciliation, expired observation and DELETE attempts and SIGKILL recovery cases must execute"
          assert not any(case.find(tag) is not None for case in cases for tag in ("skipped", "error", "failure")), "native skips and refusals do not prove acceptance"
          PYTHON

      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-feature-linux-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-native-evidence/native-junit.xml
          if-no-files-found: error
          retention-days: 7

  cross-cutting-full-suite:
    name: Cross-cutting full suite
    needs: [impact, native-feature-linux, native-scene-linux]
    if: >-
      always() && needs.impact.result == 'success' &&
      needs.impact.outputs.requires_full_suite == 'true' &&
      ((needs.impact.outputs.native_feature_required == 'true' && needs.native-feature-linux.result == 'success') ||
       (needs.impact.outputs.native_feature_required != 'true' && needs.native-feature-linux.result == 'skipped')) &&
      ((needs.impact.outputs.native_scene_required == 'true' && needs.native-scene-linux.result == 'success') ||
       (needs.impact.outputs.native_scene_required != 'true' && needs.native-scene-linux.result == 'skipped'))
    uses: ./.github/workflows/full-test-lane.yml
    with:
      reason: cross_cutting_dependency_impact
    secrets: inherit

  impacted-gate:
    name: Impacted test and sentinel gate
    needs: [impact, impacted-tests, native-scene-linux, native-feature-linux, cross-cutting-full-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require bounded impacted evidence and any requested full lane
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          IMPACTED_RESULT: ${{ needs.impacted-tests.result }}
          FULL_RESULT: ${{ needs.cross-cutting-full-suite.result }}
          FULL_REQUIRED: ${{ needs.impact.outputs.requires_full_suite }}
          NATIVE_SCENE_REQUIRED: ${{ needs.impact.outputs.native_scene_required }}
          NATIVE_SCENE_RESULT: ${{ needs.native-scene-linux.result }}
          NATIVE_REQUIRED: ${{ needs.impact.outputs.native_feature_required }}
          NATIVE_RESULT: ${{ needs.native-feature-linux.result }}
        run: |
          test "${IMPACT_RESULT}" = "success"
          test "${IMPACTED_RESULT}" = "success"
          if test "${NATIVE_REQUIRED}" = "true"; then
            test "${NATIVE_RESULT}" = "success"
          else
            test "${NATIVE_RESULT}" = "skipped"
          fi
          if test "${NATIVE_SCENE_REQUIRED}" = "true"; then
            test "${NATIVE_SCENE_RESULT}" = "success"
          else
            test "${NATIVE_SCENE_RESULT}" = "skipped"
          fi
          if test "${FULL_REQUIRED}" = "true"; then
            test "${FULL_RESULT}" = "success"
          else
            test "${FULL_RESULT}" = "skipped"
          fi

  lint:
    name: Ruff and claim lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install frozen lint tools
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Enforce Ruff and public-claim policy
        run: |
          uv run ruff check src/blueprint_pipeline scripts tests
          uv run python scripts/lint_public_scientific_claims.py
          uv run python scripts/verify_paid_resource_allocator.py
          uv run python scripts/verify_groot_oscar_thin_architecture.py

  foundation-prerequisites:
    name: GR00T OSCAR external prerequisite pins
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify paid-build prerequisites without allocating a builder
        run: |
          python3 scripts/verify_groot_oscar_live_prerequisites.py \
            --live \
            --output "${{ runner.temp }}/blueprint-ci/groot_oscar_live_prerequisites.json"

      - name: Upload prerequisite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groot-oscar-prerequisites-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-ci/groot_oscar_live_prerequisites.json
          if-no-files-found: error
          retention-days: 7

  typecheck:
    name: Typed release contract core
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install frozen type checker
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Type-check the release validation core
        run: |
          uv run mypy \
            --follow-imports=skip \
            --ignore-missing-imports \
            --show-error-codes \
            --no-error-summary \
            src/blueprint_pipeline/release_evidence_graph.py \
            src/blueprint_pipeline/spend_admission_lock.py \
            src/blueprint_pipeline/live_pipeline_manifest_alert.py \
            scripts/archive_release_evidence.py \
            scripts/build_container_production_evidence.py \
            scripts/build_cpu_full_lane_evidence.py \
            scripts/build_gpu_provider_canary_evidence.py \
            scripts/build_release_evidence_graph.py \
            scripts/build_release_evidence_bundle.py \
            scripts/build_supply_chain_evidence.py \
            scripts/gpu_spend_guard.py \
            scripts/run_native_lerobot_export_probe.py \
            scripts/run_pubsub_emulator_integration.py \
            scripts/run_deployment_service_canaries.py \
            scripts/validate_terraform_state_backend.py \
            scripts/validate_release_signature_evidence.py \
            scripts/verify_bandit_policy.py \
            scripts/verify_clean_checkout_inputs.py \
            scripts/verify_critical_capability_lanes.py \
            scripts/verify_dependency_exports.py \
            scripts/verify_distribution_metadata.py \
            scripts/verify_deploy_release_provenance.py \
            scripts/verify_full_lane_collection.py \
            scripts/verify_source_governance.py

  sast:
    name: Bandit high and reviewed-medium gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install frozen SAST tools
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Scan and enforce expiring triage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blueprint-ci"
          scan_status=0
          uv run bandit -r src/blueprint_pipeline scripts \
            --format json \
            --output "${{ runner.temp }}/blueprint-ci/bandit.json" \
            --quiet || scan_status=$?
          test "${scan_status}" -le 1
          uv run python scripts/verify_bandit_policy.py \
            --bandit-report "${{ runner.temp }}/blueprint-ci/bandit.json" \
            --output "${{ runner.temp }}/blueprint-ci/bandit-policy-gate.json"

      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blueprint-ci/bandit.json
            ${{ runner.temp }}/blueprint-ci/bandit-policy-gate.json
          if-no-files-found: error
          retention-days: 7

  source-governance:
    name: Module and critical-lane governance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pinned policy runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Enforce source and capability policy
        run: |
          uv run --no-project --python 3.12 python scripts/verify_source_governance.py \
            --output "${{ runner.temp }}/blueprint-ci/source-governance.json"
          uv run --no-project --python 3.12 python scripts/verify_critical_capability_lanes.py \
            --policy-only \
            --output "${{ runner.temp }}/blueprint-ci/critical-capability-policy.json"

  supply-chain:
    name: SBOM, license, and provenance contract
    needs: [impacted-gate, lint, typecheck, sast, source-governance, dependency-security, container-contract]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Verify lock and build distributions
        run: |
          uv lock --check
          uv sync --frozen --extra dev
          uv build --out-dir "${{ runner.temp }}/blueprint-ci/dist"
          uv run python scripts/verify_distribution_metadata.py \
            --dist-dir "${{ runner.temp }}/blueprint-ci/dist"

      - name: Generate CycloneDX, SPDX, license, and unsigned provenance evidence
        shell: bash
        run: |
          set -euo pipefail
          uv export \
            --preview-features sbom-export \
            --frozen \
            --no-dev \
            --format cyclonedx1.5 \
            --output-file "${{ runner.temp }}/blueprint-ci/runtime.cyclonedx.input.json"
          mapfile -t artifacts < <(
            find "${{ runner.temp }}/blueprint-ci/dist" -maxdepth 1 -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) -print | sort
          )
          artifact_args=()
          for artifact in "${artifacts[@]}"; do
            artifact_args+=(--artifact "${artifact}")
          done
          uv run python scripts/build_supply_chain_evidence.py \
            --cyclonedx "${{ runner.temp }}/blueprint-ci/runtime.cyclonedx.input.json" \
            --output-dir "${{ runner.temp }}/blueprint-ci/supply-chain" \
            "${artifact_args[@]}"

      - name: Checkout pinned public Contracts source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ognjhunt/BlueprintContracts
          ref: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
          path: .source-contracts
          persist-credentials: false

      - name: Build canonical privileged source SHA256 manifest
        id: source-manifest
        run: |
          manifest_sha256="$(uv run python scripts/release_source_manifest.py build \
            --pipeline-root "${GITHUB_WORKSPACE}" \
            --contracts-root "${GITHUB_WORKSPACE}/.source-contracts" \
            --source-commit "${GITHUB_SHA}" \
            --output "${{ runner.temp }}/blueprint-ci/supply-chain/source-sha256-manifest.json")"
          printf 'sha256=%s\n' "${manifest_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Keyless attest privileged source manifest on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: attest-source
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ runner.temp }}/blueprint-ci/supply-chain/source-sha256-manifest.json
          predicate-path: ${{ runner.temp }}/blueprint-ci/supply-chain/source-sha256-manifest.json
          predicate-type: https://github.com/ognjhunt/BlueprintCapturePipeline/attestations/source-sha256-manifest/v1

      - name: Keyless attest distribution provenance on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: attest-provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/blueprint-ci/dist/*.whl
            ${{ runner.temp }}/blueprint-ci/dist/*.tar.gz

      - name: Keyless attest distribution SBOM on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: attest-sbom
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/blueprint-ci/dist/*.whl
            ${{ runner.temp }}/blueprint-ci/dist/*.tar.gz
          sbom-path: ${{ runner.temp }}/blueprint-ci/supply-chain/runtime.spdx.json

      - name: Preserve keyless attestation bundles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROVENANCE_BUNDLE_PATH: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
          SOURCE_BUNDLE_PATH: ${{ steps.attest-source.outputs.bundle-path }}
        run: |
          cp "${PROVENANCE_BUNDLE_PATH}" \
            "${{ runner.temp }}/blueprint-ci/supply-chain/distribution-provenance.sigstore.json"
          cp "${SBOM_BUNDLE_PATH}" \
            "${{ runner.temp }}/blueprint-ci/supply-chain/distribution-sbom.sigstore.json"
          cp "${SOURCE_BUNDLE_PATH}" \
            "${{ runner.temp }}/blueprint-ci/supply-chain/source-provenance.sigstore.json"

      # Public metadata is only a locator. Consumers authenticate the embedded
      # manifest through the public attestation bundle and strict signer policy.
      - name: Publish public source attestation digest locator
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.attest-source.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sha256-${{ github.sha }}-${{ steps.source-manifest.outputs.sha256 }}
          path: |
            ${{ runner.temp }}/blueprint-ci/supply-chain/source-sha256-manifest.json
            ${{ runner.temp }}/blueprint-ci/supply-chain/source-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blueprint-ci/dist/*
            ${{ runner.temp }}/blueprint-ci/supply-chain/*.json
          if-no-files-found: error
          retention-days: 7

  dependency-security:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Audit frozen runtime dependencies
        run: |
          python scripts/run_dependency_security_gate.py \
            --output "${{ runner.temp }}/blueprint-ci/dependency-security-gate.json"

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-ci/dependency-security-gate.json
          if-no-files-found: error
          retention-days: 7

  container-contract:
    name: Container production contract
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up canonical Python for static systemd validation
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Enforce systemd security baseline
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources"
          uv run --no-project --python 3.12 python scripts/verify_systemd_ci.py \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/systemd-security.log" 2>&1
          printf '%s\n' 'systemd-security-ok' \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/systemd-security.ok"

      - name: Validate Compose contract
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources"
          docker compose config --quiet
          docker compose config --no-interpolate \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/compose-config.yml"
          printf '%s\n' 'compose-config-ok' \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/compose-config.ok"

      - name: Build production and development targets
        run: |
          set -euo pipefail
          docker build --target production \
            --tag "blueprint-capture-pipeline:${GITHUB_SHA}" .
          docker build --target development \
            --tag "blueprint-capture-pipeline-dev:${GITHUB_SHA}" .
          docker image inspect --format '{{.Id}}' \
            "blueprint-capture-pipeline:${GITHUB_SHA}" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/production_image_id.txt"
          docker image inspect --format '{{.Id}}' \
            "blueprint-capture-pipeline-dev:${GITHUB_SHA}" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/development_image_id.txt"

      - name: Enforce nonroot, read-only, no-network smoke
        run: |
          set -euo pipefail
          production_image="blueprint-capture-pipeline:${GITHUB_SHA}"
          development_image="blueprint-capture-pipeline-dev:${GITHUB_SHA}"
          docker image inspect --format '{{.Config.User}}' "${production_image}" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/production_user.txt"
          docker image inspect --format '{{.Config.User}}' "${development_image}" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/development_user.txt"
          test "$(cat "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/production_user.txt")" = \
            "blueprint:blueprint"
          test "$(cat "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/development_user.txt")" = \
            "blueprint:blueprint"
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,mode=1777 \
            --entrypoint python \
            "${production_image}" \
            -c "import blueprint_pipeline; print('container-smoke-ok')" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/production-runtime-smoke.log"
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,mode=1777 \
            --entrypoint python \
            "${development_image}" \
            -c "import blueprint_pipeline; print('container-smoke-ok')" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/development-runtime-smoke.log"

      - name: Build strict container-production evidence
        if: always()
        run: |
          python scripts/build_container_production_evidence.py \
            --source-dir "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources" \
            --repository-sha '${{ github.sha }}' \
            --output "${{ runner.temp }}/blueprint-ci/container-production/container_production.json"

      - name: Upload container-production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-production-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-ci/container-production
          if-no-files-found: error
          retention-days: 7
