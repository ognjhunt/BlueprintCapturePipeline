name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Determine changed test surface
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      requires_full_suite: ${{ steps.plan.outputs.requires_full_suite }}
      selected_test_count: ${{ steps.plan.outputs.selected_test_count }}
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Build deterministic impact plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m blueprint_pipeline.impacted_test_selection \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --no-worktree \
            --plan-only \
            --plan-output "${{ runner.temp }}/blueprint-ci/impacted-test-plan.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload impact plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impacted-test-plan-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-ci/impacted-test-plan.json
          if-no-files-found: error
          retention-days: 30

  impacted-tests:
    name: Impacted tests and sentinels
    needs: impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI runners are ephemeral; never use the checkout as a durable artifact cache.
      BLUEPRINT_ALLOW_REPO_OUTPUT: "0"
      BLUEPRINT_ALLOW_LARGE_ARTIFACTS: "0"
      CONTRACTS_REPOSITORY: ognjhunt/BlueprintContracts
      # Keep this aligned with the blueprint-contracts pin in pyproject.toml.
      CONTRACTS_REF: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
      CONTRACTS_TOKEN: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}
    steps:
      - name: Bind ephemeral artifact roots
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "BLUEPRINT_ARTIFACT_CACHE_ROOT=${RUNNER_TEMP}/blueprint-artifact-cache" >> "${GITHUB_ENV}"
          printf '%s\n' "BLUEPRINT_EVIDENCE_ROOT=${RUNNER_TEMP}/blueprint-evidence" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Checkout BlueprintContracts
        shell: bash
        run: |
          set -euo pipefail
          git init BlueprintContracts
          cd BlueprintContracts
          git remote add origin "https://x-access-token:${CONTRACTS_TOKEN}@github.com/${CONTRACTS_REPOSITORY}.git"
          fetch_ref="${CONTRACTS_REF:-main}"
          if git fetch --depth=1 origin "${fetch_ref}"; then
            echo "Using BlueprintContracts ref ${fetch_ref}."
          else
            echo "::error::BlueprintContracts ref '${fetch_ref}' was not available. Push a matching Contracts branch/ref or set CONTRACTS_REF; refusing to validate against an implicit fallback."
            exit 1
          fi
          git checkout --detach FETCH_HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install portable review-video toolchain
        shell: bash
        # Bounded well below the job's own budget. The apt hardening below
        # handles a mirror *failing*; it does nothing for a mirror that simply
        # hangs, and on 2026-08-17 that consumed all ten minutes of this job
        # and cancelled it before a single test ran -- the exact outcome the
        # comment below says must not happen. A hang now fails this step fast,
        # with the cause named, instead of destroying the test evidence.
        timeout-minutes: 4
        run: |
          set -euo pipefail
          # GitHub-hosted runners also carry third-party Microsoft/Azure apt
          # sources.  A transient mirror or signing failure there must not
          # consume this bounded impacted-test job before its test evidence
          # is even collected; use the same Ubuntu-media preparation as the
          # production full CPU lane.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete || true
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3
          sudo apt-get install -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 -y ffmpeg

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra dev
          uv pip install -e BlueprintContracts

      - name: Run impacted tests and always-on sentinels
        run: |
          uv run python -m blueprint_pipeline.impacted_test_selection \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --no-worktree \
            --timeout-seconds 480 \
            --plan-output "${{ runner.temp }}/blueprint-ci/impacted-test-plan.json" \
            --junit "${{ runner.temp }}/blueprint-ci/impacted-tests-junit.xml"

      - name: Upload impacted test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impacted-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blueprint-ci/impacted-test-plan.json
            ${{ runner.temp }}/blueprint-ci/impacted-tests-junit.xml
          if-no-files-found: error
          retention-days: 90

  cross-cutting-full-suite:
    name: Cross-cutting full suite
    needs: impact
    if: needs.impact.outputs.requires_full_suite == 'true'
    uses: ./.github/workflows/full-test-lane.yml
    with:
      reason: cross_cutting_dependency_impact
    secrets: inherit

  impacted-gate:
    name: Impacted test and sentinel gate
    needs: [impact, impacted-tests, cross-cutting-full-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require bounded impacted evidence and any requested full lane
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          IMPACTED_RESULT: ${{ needs.impacted-tests.result }}
          FULL_RESULT: ${{ needs.cross-cutting-full-suite.result }}
        run: |
          test "${IMPACT_RESULT}" = "success"
          test "${IMPACTED_RESULT}" = "success"
          test "${FULL_RESULT}" = "success" || test "${FULL_RESULT}" = "skipped"

  lint:
    name: Ruff and claim lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install frozen lint tools
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Enforce Ruff and public-claim policy
        run: |
          uv run ruff check src/blueprint_pipeline scripts tests
          uv run python scripts/lint_public_scientific_claims.py
          uv run python scripts/verify_paid_resource_allocator.py
          uv run python scripts/verify_groot_oscar_thin_architecture.py

  foundation-prerequisites:
    name: GR00T OSCAR external prerequisite pins
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify paid-build prerequisites without allocating a builder
        run: |
          python3 scripts/verify_groot_oscar_live_prerequisites.py \
            --live \
            --output "${{ runner.temp }}/blueprint-ci/groot_oscar_live_prerequisites.json"

      - name: Upload prerequisite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groot-oscar-prerequisites-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-ci/groot_oscar_live_prerequisites.json
          if-no-files-found: error
          retention-days: 90

  typecheck:
    name: Typed release contract core
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install frozen type checker
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Type-check the release validation core
        run: |
          uv run mypy \
            --follow-imports=skip \
            --ignore-missing-imports \
            --show-error-codes \
            --no-error-summary \
            src/blueprint_pipeline/release_evidence_graph.py \
            src/blueprint_pipeline/spend_admission_lock.py \
            src/blueprint_pipeline/live_pipeline_manifest_alert.py \
            scripts/archive_release_evidence.py \
            scripts/build_container_production_evidence.py \
            scripts/build_cpu_full_lane_evidence.py \
            scripts/build_gpu_provider_canary_evidence.py \
            scripts/build_release_evidence_graph.py \
            scripts/build_release_evidence_bundle.py \
            scripts/build_supply_chain_evidence.py \
            scripts/gpu_spend_guard.py \
            scripts/run_native_lerobot_export_probe.py \
            scripts/run_pubsub_emulator_integration.py \
            scripts/run_deployment_service_canaries.py \
            scripts/validate_terraform_state_backend.py \
            scripts/validate_release_signature_evidence.py \
            scripts/verify_bandit_policy.py \
            scripts/verify_clean_checkout_inputs.py \
            scripts/verify_critical_capability_lanes.py \
            scripts/verify_dependency_exports.py \
            scripts/verify_distribution_metadata.py \
            scripts/verify_deploy_release_provenance.py \
            scripts/verify_full_lane_collection.py \
            scripts/verify_source_governance.py

  sast:
    name: Bandit high and reviewed-medium gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install frozen SAST tools
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Scan and enforce expiring triage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blueprint-ci"
          scan_status=0
          uv run bandit -r src/blueprint_pipeline scripts \
            --format json \
            --output "${{ runner.temp }}/blueprint-ci/bandit.json" \
            --quiet || scan_status=$?
          test "${scan_status}" -le 1
          uv run python scripts/verify_bandit_policy.py \
            --bandit-report "${{ runner.temp }}/blueprint-ci/bandit.json" \
            --output "${{ runner.temp }}/blueprint-ci/bandit-policy-gate.json"

      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blueprint-ci/bandit.json
            ${{ runner.temp }}/blueprint-ci/bandit-policy-gate.json
          if-no-files-found: error
          retention-days: 90

  source-governance:
    name: Module and critical-lane governance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pinned policy runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Enforce source and capability policy
        run: |
          uv run --no-project --python 3.12 python scripts/verify_source_governance.py \
            --output "${{ runner.temp }}/blueprint-ci/source-governance.json"
          uv run --no-project --python 3.12 python scripts/verify_critical_capability_lanes.py \
            --policy-only \
            --output "${{ runner.temp }}/blueprint-ci/critical-capability-policy.json"

  supply-chain:
    name: SBOM, license, and provenance contract
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Verify lock and build distributions
        run: |
          uv lock --check
          uv sync --frozen --extra dev
          uv build --out-dir "${{ runner.temp }}/blueprint-ci/dist"
          uv run python scripts/verify_distribution_metadata.py \
            --dist-dir "${{ runner.temp }}/blueprint-ci/dist"

      - name: Generate CycloneDX, SPDX, license, and unsigned provenance evidence
        shell: bash
        run: |
          set -euo pipefail
          uv export \
            --preview-features sbom-export \
            --frozen \
            --no-dev \
            --format cyclonedx1.5 \
            --output-file "${{ runner.temp }}/blueprint-ci/runtime.cyclonedx.input.json"
          mapfile -t artifacts < <(
            find "${{ runner.temp }}/blueprint-ci/dist" -maxdepth 1 -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) -print | sort
          )
          artifact_args=()
          for artifact in "${artifacts[@]}"; do
            artifact_args+=(--artifact "${artifact}")
          done
          uv run python scripts/build_supply_chain_evidence.py \
            --cyclonedx "${{ runner.temp }}/blueprint-ci/runtime.cyclonedx.input.json" \
            --output-dir "${{ runner.temp }}/blueprint-ci/supply-chain" \
            "${artifact_args[@]}"

      - name: Keyless attest distribution provenance on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: attest-provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/blueprint-ci/dist/*.whl
            ${{ runner.temp }}/blueprint-ci/dist/*.tar.gz

      - name: Keyless attest distribution SBOM on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: attest-sbom
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/blueprint-ci/dist/*.whl
            ${{ runner.temp }}/blueprint-ci/dist/*.tar.gz
          sbom-path: ${{ runner.temp }}/blueprint-ci/supply-chain/runtime.spdx.json

      - name: Preserve keyless attestation bundles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROVENANCE_BUNDLE_PATH: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          cp "${PROVENANCE_BUNDLE_PATH}" \
            "${{ runner.temp }}/blueprint-ci/supply-chain/distribution-provenance.sigstore.json"
          cp "${SBOM_BUNDLE_PATH}" \
            "${{ runner.temp }}/blueprint-ci/supply-chain/distribution-sbom.sigstore.json"

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blueprint-ci/dist/*
            ${{ runner.temp }}/blueprint-ci/supply-chain/*.json
          if-no-files-found: error
          retention-days: 90

  dependency-security:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Audit frozen runtime dependencies
        run: |
          python scripts/run_dependency_security_gate.py \
            --output "${{ runner.temp }}/blueprint-ci/dependency-security-gate.json"

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-ci/dependency-security-gate.json
          if-no-files-found: error
          retention-days: 90

  container-contract:
    name: Container production contract
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enforce systemd security baseline
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources"
          {
            systemd-analyze verify deploy/systemd/blueprint-*.service
            for unit in deploy/systemd/blueprint-*.service; do
              systemd-analyze security --offline=yes --no-pager \
                --threshold=40 "${unit}"
            done
          } > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/systemd-security.log" 2>&1
          printf '%s\n' 'systemd-security-ok' \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/systemd-security.ok"

      - name: Validate Compose contract
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources"
          docker compose config --quiet
          docker compose config --no-interpolate \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/compose-config.yml"
          printf '%s\n' 'compose-config-ok' \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/compose-config.ok"

      - name: Build production and development targets
        run: |
          set -euo pipefail
          docker build --target production \
            --tag "blueprint-capture-pipeline:${GITHUB_SHA}" .
          docker build --target development \
            --tag "blueprint-capture-pipeline-dev:${GITHUB_SHA}" .
          docker image inspect --format '{{.Id}}' \
            "blueprint-capture-pipeline:${GITHUB_SHA}" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/production_image_id.txt"
          docker image inspect --format '{{.Id}}' \
            "blueprint-capture-pipeline-dev:${GITHUB_SHA}" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/development_image_id.txt"

      - name: Enforce nonroot, read-only, no-network smoke
        run: |
          set -euo pipefail
          production_image="blueprint-capture-pipeline:${GITHUB_SHA}"
          development_image="blueprint-capture-pipeline-dev:${GITHUB_SHA}"
          docker image inspect --format '{{.Config.User}}' "${production_image}" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/production_user.txt"
          docker image inspect --format '{{.Config.User}}' "${development_image}" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/development_user.txt"
          test "$(cat "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/production_user.txt")" = \
            "blueprint:blueprint"
          test "$(cat "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/development_user.txt")" = \
            "blueprint:blueprint"
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,mode=1777 \
            --entrypoint python \
            "${production_image}" \
            -c "import blueprint_pipeline; print('container-smoke-ok')" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/production-runtime-smoke.log"
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,mode=1777 \
            --entrypoint python \
            "${development_image}" \
            -c "import blueprint_pipeline; print('container-smoke-ok')" \
            > "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources/development-runtime-smoke.log"

      - name: Build strict container-production evidence
        if: always()
        run: |
          python scripts/build_container_production_evidence.py \
            --source-dir "${{ runner.temp }}/blueprint-ci/container-production/container-production-sources" \
            --repository-sha '${{ github.sha }}' \
            --output "${{ runner.temp }}/blueprint-ci/container-production/container_production.json"

      - name: Upload container-production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-production-${{ github.sha }}
          path: ${{ runner.temp }}/blueprint-ci/container-production
          if-no-files-found: error
          retention-days: 90
