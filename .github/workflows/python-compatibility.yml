name: Python Compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/python-compatibility.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - "docs/CI_PYTHON_INTERPRETER_MATRIX.*"
      - "scripts/lint_public_scientific_claims.py"
      - "scripts/validate_python_interpreter_matrix.py"
      - "scripts/verify_dependency_exports.py"
      - "src/blueprint_pipeline/**"
      - "tests/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/python-compatibility.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - "docs/CI_PYTHON_INTERPRETER_MATRIX.*"
      - "scripts/lint_public_scientific_claims.py"
      - "scripts/validate_python_interpreter_matrix.py"
      - "scripts/verify_dependency_exports.py"
      - "src/blueprint_pipeline/**"
      - "tests/**"

concurrency:
  group: python-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CONTRACTS_REPOSITORY: ognjhunt/BlueprintContracts
      # Keep this aligned with the blueprint-contracts pin in pyproject.toml.
      CONTRACTS_REF: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
      CONTRACTS_TOKEN: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Checkout BlueprintContracts
        shell: bash
        run: |
          set -euo pipefail
          git init BlueprintContracts
          cd BlueprintContracts
          git remote add origin "https://x-access-token:${CONTRACTS_TOKEN}@github.com/${CONTRACTS_REPOSITORY}.git"
          if ! git fetch --depth=1 origin "${CONTRACTS_REF}"; then
            echo "::error::Pinned BlueprintContracts ref '${CONTRACTS_REF}' was not available."
            exit 1
          fi
          git checkout --detach FETCH_HEAD

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: ${{ matrix.python-version }}

      - name: Verify lock and compatibility exports
        run: |
          uv lock --check
          python3 scripts/verify_dependency_exports.py

      - name: Install frozen dependencies
        run: |
          uv sync --frozen --python "${{ matrix.python-version }}" --extra dev
          uv pip install -e BlueprintContracts

      - name: Validate declared interpreter policy
        run: uv run python scripts/validate_python_interpreter_matrix.py

      - name: Run compatibility contract suite
        run: |
          uv run python -m pytest -q \
            tests/test_eval_ready_task_grounding.py \
            tests/test_public_scientific_claims.py \
            tests/test_sc3_eval_protocol.py
