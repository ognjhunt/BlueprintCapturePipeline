name: Terraform Static

# Syntax and provider-schema checks for deploy/terraform (plan 14 PR 5.2).
# There are no credentials here: this workflow never plans, applies or reads
# state, and it runs only for changes under deploy/terraform.

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/terraform/**"
      - ".github/workflows/terraform-static.yml"
  pull_request:
    paths:
      - "deploy/terraform/**"
      - ".github/workflows/terraform-static.yml"
  workflow_dispatch:

concurrency:
  group: terraform-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-static:
    name: Terraform fmt and validate without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Install the locked providers without a backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate syntax and provider schema
        run: terraform validate -no-color
