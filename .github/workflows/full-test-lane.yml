name: Full Test Lane
run-name: Full Test Lane / ${{ inputs.reason || 'nightly_integration' }}

on:
  workflow_call:
    inputs:
      reason:
        description: "Recorded reason the dependency boundary requires the full lane."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is a full lane required?"
        required: true
        type: choice
        options:
          - production_deployment_promotion
          - cross_cutting_diagnostic
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: full-test-lane-${{ github.workflow }}-${{ github.ref }}
  # Preserve healthy integration and promotion evidence even when a newer SHA
  # appears. A superseded result remains diagnostic; it is never provenance for
  # the newer SHA.
  cancel-in-progress: false

jobs:
  full-pytest-shard:
    name: Full pytest shard ${{ matrix.shard_index }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      # Full-lane artifacts live only on the disposable GitHub runner and are
      # uploaded with the workflow's explicit retention policy.
      BLUEPRINT_ALLOW_REPO_OUTPUT: "0"
      BLUEPRINT_ALLOW_LARGE_ARTIFACTS: "0"
      CONTRACTS_REPOSITORY: ognjhunt/BlueprintContracts
      # Keep this aligned with the blueprint-contracts pin in pyproject.toml.
      CONTRACTS_REF: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
      CONTRACTS_TOKEN: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}
      FULL_TEST_LANE_TRIGGER_REASON: ${{ inputs.reason || 'nightly_integration' }}
      FULL_TEST_LANE_SHARD_INDEX: ${{ matrix.shard_index }}

    steps:
      - name: Bind ephemeral artifact roots
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "BLUEPRINT_ARTIFACT_CACHE_ROOT=${RUNNER_TEMP}/blueprint-artifact-cache" >> "${GITHUB_ENV}"
          printf '%s\n' "BLUEPRINT_EVIDENCE_ROOT=${RUNNER_TEMP}/blueprint-evidence" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout BlueprintContracts
        shell: bash
        run: |
          set -euo pipefail
          git init BlueprintContracts
          cd BlueprintContracts
          git remote add origin "https://x-access-token:${CONTRACTS_TOKEN}@github.com/${CONTRACTS_REPOSITORY}.git"
          fetch_ref="${CONTRACTS_REF:-main}"
          if git fetch --depth=1 origin "${fetch_ref}"; then
            echo "Using BlueprintContracts ref ${fetch_ref}."
          else
            echo "::error::BlueprintContracts ref '${fetch_ref}' was not available. Push a matching Contracts branch/ref or set CONTRACTS_REF; refusing to validate against an implicit fallback."
            exit 1
          fi
          git checkout --detach FETCH_HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install system media dependencies
        # Bounded so a hung apt mirror fails here, fast and named, instead of
        # consuming the job it runs in. On 2026-08-17 an unbounded sibling of
        # this step hung for an hour at the first step of a deploy-gating lane
        # while the same work normally finishes in about a minute.
        timeout-minutes: 12
        run: |
          # The runner image ships ffmpeg; installing it again puts every run
          # on the apt mirror's critical path for nothing. Tonight that mirror
          # served packages at seconds each: connections flowed, so timeouts
          # never fired; nothing errored, so retries never fired; the step just
          # needed more than any sane bound. Skip apt when the tool is already
          # there, and give the genuine fallback mirror-sized room.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -n1)"
            exit 0
          fi
          # ffmpeg comes from Ubuntu's repositories. GitHub-hosted runners also
          # carry third-party Microsoft/Azure apt sources, and transient signing
          # or mirror errors there should not block this CPU validation lane.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete || true
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3
          sudo apt-get install -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/splat_render/package-lock.json

      - name: Install sealed-camera renderer dependencies
        working-directory: tools/splat_render
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Python dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra cloud --extra groot-libero-cpu --extra evaluation \
            --extra sapien-development --extra exact-geometry-development
          uv pip install -e BlueprintContracts

      - name: Validate Python interpreter matrix
        run: uv run python scripts/validate_python_interpreter_matrix.py --assert-current

      - name: Verify shared robot-eval request contract
        run: |
          uv run python scripts/verify_robot_eval_job_request_contract.py \
            --contracts-repo BlueprintContracts

      - name: Verify production fail-closed posture
        env:
          BLUEPRINT_LAUNCH_PROOF_MODE: production
          PRIVACY_PIPELINE_ENABLED: "true"
          PRIVACY_FAIL_CLOSED: "true"
          PIPELINE_SYNC_REQUIRED: "true"
          RETRIEVAL_REQUIRE_PRIVACY_SAFE_VIDEO: "true"
        run: |
          uv run python -m pytest -q \
            tests/test_launch_proof_policy.py \
            tests/test_production_runtime_env_guard.py \
            tests/test_deploy_systemd_contract.py \
            tests/test_webapp_sync.py::test_production_sync_is_required_and_disables_placeholder_fallback \
            tests/test_provider_preview_qa.py::test_provider_preview_qa_blocks_raw_bypass_in_production

      - name: Collect full lane
        env:
          BLUEPRINT_FULL_LANE_COLLECTION_MANIFEST: ${{ runner.temp }}/blueprint-ci/full-test-lane-planned.json
          BLUEPRINT_FULL_LANE_EVIDENCE_PHASE: planned
        run: |
          mkdir -p "${{ runner.temp }}/blueprint-ci"
          # Exact Drake/Chrono/Isaac runtimes and retained real-dataset bytes
          # are separately provisioned by their evidence lanes. Keep those
          # unavailable inputs out of this hermetic CPU lane instead of
          # converting their honest absence into a skip blocker.
          uv run python -m pytest \
            -p blueprint_pipeline.pytest_full_lane_evidence \
            -m "not external_runtime and not external_data" --collect-only -q \
            > "${{ runner.temp }}/blueprint-ci/full-test-lane-collection.txt"

      - name: Build deterministic full-lane shard plan
        run: |
          set -euo pipefail
          cp .github/full-test-lane-duration-baseline.json \
            "${{ runner.temp }}/blueprint-ci/full-test-lane-duration-baseline.json"
          uv run python scripts/full_lane_sharding.py plan \
            --planned "${{ runner.temp }}/blueprint-ci/full-test-lane-planned.json" \
            --duration-baseline "${{ runner.temp }}/blueprint-ci/full-test-lane-duration-baseline.json" \
            --repository-sha '${{ github.sha }}' \
            --output "${{ runner.temp }}/blueprint-ci/full-test-lane-shard-plan.json"

      - name: Run full lane shard
        env:
          BLUEPRINT_FULL_LANE_COLLECTION_MANIFEST: ${{ runner.temp }}/blueprint-ci/full-test-lane-shard-executed.json
          BLUEPRINT_FULL_LANE_EVIDENCE_PHASE: executed
        run: |
          set -euo pipefail
          mapfile -t shard_files < <(
            jq -r --argjson shard "${FULL_TEST_LANE_SHARD_INDEX}" \
              '.shards[] | select(.index == $shard) | .files[]' \
              "${{ runner.temp }}/blueprint-ci/full-test-lane-shard-plan.json"
          )
          if [[ "${#shard_files[@]}" -eq 0 ]]; then
            echo "::error::Deterministic shard ${FULL_TEST_LANE_SHARD_INDEX} has no assigned files."
            exit 1
          fi
          uv run scripts/pytest_full.sh \
            -p blueprint_pipeline.pytest_full_lane_evidence \
            --junitxml="${{ runner.temp }}/blueprint-ci/full-test-lane-shard-junit.xml" \
            -m "not external_runtime and not external_data" \
            "${shard_files[@]}"

      - name: Verify exact full-lane shard
        if: always()
        run: |
          uv run python scripts/full_lane_sharding.py verify-shard \
            --planned "${{ runner.temp }}/blueprint-ci/full-test-lane-planned.json" \
            --duration-baseline "${{ runner.temp }}/blueprint-ci/full-test-lane-duration-baseline.json" \
            --plan "${{ runner.temp }}/blueprint-ci/full-test-lane-shard-plan.json" \
            --executed "${{ runner.temp }}/blueprint-ci/full-test-lane-shard-executed.json" \
            --junit "${{ runner.temp }}/blueprint-ci/full-test-lane-shard-junit.xml" \
            --repository-sha '${{ github.sha }}' \
            --shard-index "${FULL_TEST_LANE_SHARD_INDEX}" \
            --output "${{ runner.temp }}/blueprint-ci/full-test-lane-shard-verification.json"

      - name: Upload full-lane shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-test-lane-shard-${{ matrix.shard_index }}-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/blueprint-ci/full-test-lane-collection.txt
            ${{ runner.temp }}/blueprint-ci/full-test-lane-planned.json
            ${{ runner.temp }}/blueprint-ci/full-test-lane-duration-baseline.json
            ${{ runner.temp }}/blueprint-ci/full-test-lane-shard-plan.json
            ${{ runner.temp }}/blueprint-ci/full-test-lane-shard-executed.json
            ${{ runner.temp }}/blueprint-ci/full-test-lane-shard-junit.xml
            ${{ runner.temp }}/blueprint-ci/full-test-lane-shard-verification.json

  full-pytest:
    name: Full pytest lane on CPU runner
    needs: full-pytest-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLUEPRINT_ALLOW_REPO_OUTPUT: "0"
      BLUEPRINT_ALLOW_LARGE_ARTIFACTS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Download exact full-lane shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: full-test-lane-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/blueprint-full-lane-shards

      - name: Aggregate exact full-lane shards
        run: |
          set -euo pipefail
          uv run python scripts/full_lane_sharding.py aggregate \
            --shard-root "${{ runner.temp }}/blueprint-full-lane-shards" \
            --repository-sha '${{ github.sha }}' \
            --output-dir "${{ runner.temp }}/blueprint-ci"

      - name: Build fail-closed CPU full-lane evidence
        if: always()
        run: |
          uv run python scripts/build_cpu_full_lane_evidence.py \
            --planned "${{ runner.temp }}/blueprint-ci/full-test-lane-planned.json" \
            --executed "${{ runner.temp }}/blueprint-ci/full-test-lane-executed.json" \
            --junit "${{ runner.temp }}/blueprint-ci/full-test-lane-junit.xml" \
            --repository-sha '${{ github.sha }}' \
            --output "${{ runner.temp }}/blueprint-ci/cpu_full.json"

      - name: Build test-suite duration and matrix telemetry
        if: always()
        run: |
          uv run python scripts/build_test_suite_telemetry.py \
            --junit "${{ runner.temp }}/blueprint-ci/full-test-lane-junit.xml" \
            --repository-sha '${{ github.sha }}' \
            --workers 4 \
            --strategy deterministic_file_preserving_serial_shards \
            --output "${{ runner.temp }}/blueprint-ci/test-suite-telemetry.json"

      - name: Upload full lane report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-test-lane-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/blueprint-ci/
