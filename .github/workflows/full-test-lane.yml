name: Isolated native storage diagnostic
run-name: Isolated native storage diagnostic / original ba9db941 test
'on':
  workflow_dispatch:
    inputs:
      reason:
        description: Diagnostic only; never production provenance.
        required: true
        type: choice
        options:
        - cross_cutting_diagnostic
permissions:
  contents: read
jobs:
  isolated-native-storage:
    name: One original registered disk lifecycle test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BLUEPRINT_ALLOW_REPO_OUTPUT: '0'
      BLUEPRINT_ALLOW_LARGE_ARTIFACTS: '0'
      BLUEPRINT_DISPOSABLE_LINUX_TEST: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PROJECT_ENVIRONMENT: /var/lib/blueprint-native-test-venv
      CONTRACTS_REPOSITORY: ognjhunt/BlueprintContracts
      CONTRACTS_REF: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
      CONTRACTS_TOKEN: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}
      BLUEPRINT_ALLOW_VAST_API_CALLS: 'false'
      BLUEPRINT_ALLOW_VAST_INSTANCE_LAUNCH: 'false'
    steps:
    - name: Bind ephemeral artifact roots
      shell: bash
      run: 'set -euo pipefail

        printf ''%s\n'' "BLUEPRINT_ARTIFACT_CACHE_ROOT=${RUNNER_TEMP}/blueprint-artifact-cache" >> "${GITHUB_ENV}"

        printf ''%s\n'' "BLUEPRINT_EVIDENCE_ROOT=${RUNNER_TEMP}/blueprint-evidence" >> "${GITHUB_ENV}"

        '
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
    - name: Require identical production Python and test inputs
      run: 'python3 - <<''PYTHON''

        import subprocess

        changed = subprocess.check_output(["git", "diff", "--name-only", "ba9db94138bb395146f2045a26cae6f73ee74ea0", "HEAD",
        "--", "src", "tests", "scripts", "deploy", "pyproject.toml", "uv.lock"])

        assert not changed, changed.decode()

        PYTHON'
    - name: Checkout BlueprintContracts
      shell: bash
      run: "set -euo pipefail\ngit init BlueprintContracts\ncd BlueprintContracts\ngit remote add origin \"https://x-access-token:${CONTRACTS_TOKEN}@github.com/${CONTRACTS_REPOSITORY}.git\"\
        \nfetch_ref=\"${CONTRACTS_REF:-main}\"\nif git fetch --depth=1 origin \"${fetch_ref}\"; then\n  echo \"Using BlueprintContracts\
        \ ref ${fetch_ref}.\"\nelse\n  echo \"::error::BlueprintContracts ref '${fetch_ref}' was not available. Push a matching\
        \ Contracts branch/ref or set CONTRACTS_REF; refusing to validate against an implicit fallback.\"\n  exit 1\nfi\n\
        git checkout --detach FETCH_HEAD\n"
    - name: Bind actual native scene SDK inputs
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

        test "$(git -C BlueprintContracts rev-parse HEAD)" = "${CONTRACTS_REF}"

        printf ''%s\n'' "BLUEPRINT_NATIVE_SOURCE_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"

        printf ''%s\n'' "BLUEPRINT_NATIVE_SOURCE_COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"

        printf ''%s\n'' "BLUEPRINT_NATIVE_CONTRACTS_ROOT=${GITHUB_WORKSPACE}/BlueprintContracts" >> "${GITHUB_ENV}"

        '
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      with:
        version: 0.10.7
        python-version: '3.12'
    - name: Install system media dependencies
      shell: bash
      timeout-minutes: 12
      run: "set -euo pipefail\n# The review-video tests need ffmpeg/ffprobe on PATH -- nothing more.\n# These runners do not\
        \ ship them, and Ubuntu's apt mirrors have now\n# cost this repository three distinct outages in one night: a hung\n\
        # connection, a drip-feeding package fetch, and an index download\n# that stalled for eleven minutes. No timeout or\
        \ retry policy fixes\n# a mirror that is slow rather than broken, so the mirror is no\n# longer on this path at all.\n\
        #\n# Use versioned GitHub release assets rather than an expiring daily\n# build or a mirror that serves inconsistent\
        \ bytes to Actions runners.\nif command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then\n  echo\
        \ \"media toolchain already present: $(ffmpeg -version | head -n1)\"\n  exit 0\nfi\nFFMPEG_RELEASE=\"https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1\"\
        \ndownload_verified() {\n  local name=\"$1\" expected=\"$2\" destination=\"${RUNNER_TEMP}/$1\"\n  for attempt in 1\
        \ 2 3; do\n    rm -f \"${destination}\"\n    if curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time\
        \ 420 \\\n      -o \"${destination}\" \"${FFMPEG_RELEASE}/${name}\" \\\n      && echo \"${expected}  ${destination}\"\
        \ | sha256sum -c -; then\n      return 0\n    fi\n    echo \"${name} attempt ${attempt} failed byte verification\"\
        \n  done\n  return 1\n}\ndownload_verified ffmpeg-linux-x64.gz bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa\n\
        download_verified ffprobe-linux-x64.gz 25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067\ngzip -dc\
        \ \"${RUNNER_TEMP}/ffmpeg-linux-x64.gz\" > \"${RUNNER_TEMP}/ffmpeg\"\ngzip -dc \"${RUNNER_TEMP}/ffprobe-linux-x64.gz\"\
        \ > \"${RUNNER_TEMP}/ffprobe\"\nsudo install -m 0755 \"${RUNNER_TEMP}/ffmpeg\" /usr/local/bin/ffmpeg\nsudo install\
        \ -m 0755 \"${RUNNER_TEMP}/ffprobe\" /usr/local/bin/ffprobe\nffmpeg -version | head -n1\n"
    - name: Install and protect system-Python dependencies for full Linux proof
      run: "set -euo pipefail\nsudo --non-interactive true\nmanager=\"$(sudo --non-interactive readlink -f /proc/1/exe)\"\n\
        printf 'PID 1 executable: %s\\n' \"$manager\"\ntest \"$manager\" = /usr/lib/systemd/systemd\ntest -f /sys/fs/cgroup/cgroup.controllers\n\
        sudo install -d -m 0755 -o \"$(id -u)\" -g \"$(id -g)\" /var/lib/blueprint-native-test-venv\nuv venv --python /usr/bin/python3\
        \ /var/lib/blueprint-native-test-venv\nuv lock --check\nuv sync --frozen --no-editable --extra dev --extra cloud --extra\
        \ groot-libero-cpu --extra evaluation \\\n  --extra sapien-development --extra exact-geometry-development --python\
        \ /usr/bin/python3 --link-mode copy\nuv pip install --python /var/lib/blueprint-native-test-venv/bin/python --link-mode\
        \ copy ./BlueprintContracts\n# Noneditable policy CLIs resolve retained documents beside their\n# installed package.\
        \ Preserve those exact committed bytes outside\n# runner home, where the different-UID child can read them safely.\n\
        native_resource_root=\"$(/var/lib/blueprint-native-test-venv/bin/python -c 'from pathlib import Path; import blueprint_pipeline;\
        \ print(Path(blueprint_pipeline.__file__).resolve().parents[2])')\"\ntest \"$native_resource_root\" = /var/lib/blueprint-native-test-venv/lib/python3.12\n\
        git archive HEAD docs | tar -x -C \"$native_resource_root\"\ndiff -rq -- docs \"$native_resource_root/docs\"\n# The\
        \ actual different-UID child has ProtectHome=yes. Its interpreter\n# and imported dependencies must be protected outside\
        \ /home/runner.\nsudo chown -hR root:root /var/lib/blueprint-native-test-venv\n"
    - name: Run only the failed native lifecycle test
      env:
        PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      run: 'set -euo pipefail

        mkdir -p "${RUNNER_TEMP}/isolated-native"

        /var/lib/blueprint-native-test-venv/bin/python -m pytest tests/test_registered_feature_linux.py::test_actual_registered_disk_diagnostic_delete_offload_and_restore
        -m ''slow or not slow'' -q --maxfail=1 --junitxml="${RUNNER_TEMP}/isolated-native/junit.xml"

        python3 - "${RUNNER_TEMP}/isolated-native/junit.xml" <<''PYTHON''

        import sys, xml.etree.ElementTree as ET

        cases=list(ET.parse(sys.argv[1]).getroot().iter("testcase"))

        assert len(cases)==1

        assert not any(case.find(tag) is not None for case in cases for tag in ("skipped","failure","error"))

        PYTHON'
    - name: Retain isolated diagnostic evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: isolated-native-storage-${{ github.sha }}
        path: ${{ runner.temp }}/isolated-native/
        if-no-files-found: error
        retention-days: 7
