name: Isolated Registered Disk Diagnostic
run-name: Isolated registered disk diagnostic / source60aa0690

on:
  workflow_call:
    inputs:
      reason:
        description: "Recorded reason the dependency boundary requires the full lane."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is a full lane required?"
        required: true
        type: choice
        options:
          - production_deployment_promotion
          - cross_cutting_diagnostic

concurrency:
  # One lane per commit and reason: a promotion never queues behind the
  # nightly or another commit's lane. Provenance binds the commit a lane
  # tested, so a newer SHA neither supersedes nor needs to wait for it.
  group: full-test-lane-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ inputs.reason || 'nightly_integration' }}
  # Preserve healthy integration and promotion evidence even when a newer SHA
  # appears. A superseded result remains diagnostic; it is never provenance for
  # the newer SHA.
  cancel-in-progress: false

jobs:
  registered-diagnostic-replay:
    name: Isolated registered disk diagnostic
    runs-on: ubuntu-24.04
    # Balanced shards run about fifteen minutes; a wedged one fails here.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keep equal to scripts/full_lane_sharding.py SHARD_COUNT.
        shard_index: [10]
    env:
      # Full-lane artifacts live only on the disposable GitHub runner and are
      # uploaded with the workflow's explicit retention policy.
      BLUEPRINT_ALLOW_REPO_OUTPUT: "0"
      BLUEPRINT_ALLOW_LARGE_ARTIFACTS: "0"
      # The full collection includes the mandatory real root/UID/systemd proofs.
      # Reuse their disposable Linux installation rather than recording skips.
      BLUEPRINT_DISPOSABLE_LINUX_TEST: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PROJECT_ENVIRONMENT: /var/lib/blueprint-native-test-venv
      BLUEPRINT_RESEARCH_SDK_PYTHON: /opt/blueprint-research-sdk-proof/bin/python
      CONTRACTS_REPOSITORY: ognjhunt/BlueprintContracts
      # Keep this aligned with the blueprint-contracts pin in pyproject.toml.
      CONTRACTS_REF: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
      CONTRACTS_TOKEN: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}

    steps:
      - name: Bind ephemeral artifact roots
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "BLUEPRINT_ARTIFACT_CACHE_ROOT=${RUNNER_TEMP}/blueprint-artifact-cache" >> "${GITHUB_ENV}"
          printf '%s\n' "BLUEPRINT_EVIDENCE_ROOT=${RUNNER_TEMP}/blueprint-evidence" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The historical evidence test replays an exact retained commit.
          fetch-depth: 0

      - name: Checkout BlueprintContracts
        shell: bash
        run: |
          set -euo pipefail
          git init BlueprintContracts
          cd BlueprintContracts
          git remote add origin "https://x-access-token:${CONTRACTS_TOKEN}@github.com/${CONTRACTS_REPOSITORY}.git"
          fetch_ref="${CONTRACTS_REF:-main}"
          if git fetch --depth=1 origin "${fetch_ref}"; then
            echo "Using BlueprintContracts ref ${fetch_ref}."
          else
            echo "::error::BlueprintContracts ref '${fetch_ref}' was not available. Push a matching Contracts branch/ref or set CONTRACTS_REF; refusing to validate against an implicit fallback."
            exit 1
          fi
          git checkout --detach FETCH_HEAD

      - name: Bind actual native scene SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C BlueprintContracts rev-parse HEAD)" = "${CONTRACTS_REF}"
          printf '%s\n' "BLUEPRINT_NATIVE_SOURCE_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          printf '%s\n' "BLUEPRINT_NATIVE_SOURCE_COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          printf '%s\n' "BLUEPRINT_NATIVE_CONTRACTS_ROOT=${GITHUB_WORKSPACE}/BlueprintContracts" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install and protect system-Python dependencies for full Linux proof
        run: |
          set -euo pipefail
          sudo --non-interactive true
          manager="$(sudo --non-interactive readlink -f /proc/1/exe)"
          printf 'PID 1 executable: %s\n' "$manager"
          test "$manager" = /usr/lib/systemd/systemd
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /var/lib/blueprint-native-test-venv
          uv venv --python /usr/bin/python3 /var/lib/blueprint-native-test-venv
          uv lock --check
          uv sync --frozen --no-editable --extra dev --extra cloud --extra groot-libero-cpu --extra evaluation \
            --extra sapien-development --extra exact-geometry-development --python /usr/bin/python3 --link-mode copy
          uv pip install --python /var/lib/blueprint-native-test-venv/bin/python --link-mode copy ./BlueprintContracts
          # Noneditable policy CLIs resolve retained documents beside their
          # installed package. Preserve those exact committed bytes outside
          # runner home, where the different-UID child can read them safely.
          native_resource_root="$(/var/lib/blueprint-native-test-venv/bin/python -c 'from pathlib import Path; import blueprint_pipeline; print(Path(blueprint_pipeline.__file__).resolve().parents[2])')"
          test "$native_resource_root" = /var/lib/blueprint-native-test-venv/lib/python3.12
          git archive HEAD docs | tar -x -C "$native_resource_root"
          diff -rq -- docs "$native_resource_root/docs"
          # The actual different-UID child has ProtectHome=yes. Its interpreter
          # and imported dependencies must be protected outside /home/runner.
          sudo chown -hR root:root /var/lib/blueprint-native-test-venv

      - name: Replay only the refusing native disk diagnostic
        run: |
          uv run --no-sync python -m pytest -q -o addopts= -m "" \
            tests/test_registered_feature_linux.py::test_actual_registered_disk_diagnostic_delete_offload_and_restore \
            --junitxml="${{ runner.temp }}/isolated-registered-diagnostic.xml"

      - name: Retain isolated result without claiming full-lane qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-registered-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/isolated-registered-diagnostic.xml
          if-no-files-found: error
          retention-days: 7
