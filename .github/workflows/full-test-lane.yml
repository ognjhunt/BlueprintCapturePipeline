name: Full Test Lane

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

concurrency:
  group: full-test-lane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-pytest:
    name: Full pytest lane on CPU runner
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CONTRACTS_REPOSITORY: ognjhunt/BlueprintContracts
      # Keep this aligned with the blueprint-contracts pin in pyproject.toml.
      CONTRACTS_REF: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
      CONTRACTS_TOKEN: ${{ secrets.BLUEPRINT_CONTRACTS_CHECKOUT_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout BlueprintContracts
        shell: bash
        run: |
          set -euo pipefail
          git init BlueprintContracts
          cd BlueprintContracts
          git remote add origin "https://x-access-token:${CONTRACTS_TOKEN}@github.com/${CONTRACTS_REPOSITORY}.git"
          fetch_ref="${CONTRACTS_REF:-main}"
          if git fetch --depth=1 origin "${fetch_ref}"; then
            echo "Using BlueprintContracts ref ${fetch_ref}."
          else
            echo "::error::BlueprintContracts ref '${fetch_ref}' was not available. Push a matching Contracts branch/ref or set CONTRACTS_REF; refusing to validate against an implicit fallback."
            exit 1
          fi
          git checkout --detach FETCH_HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install system media dependencies
        run: |
          # ffmpeg comes from Ubuntu's repositories. GitHub-hosted runners also
          # carry third-party Microsoft/Azure apt sources, and transient signing
          # or mirror errors there should not block this CPU validation lane.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra cloud --extra groot-libero-cpu
          uv pip install -e BlueprintContracts

      - name: Validate Python interpreter matrix
        run: uv run python scripts/validate_python_interpreter_matrix.py --assert-current

      - name: Verify shared robot-eval request contract
        run: |
          uv run python scripts/verify_robot_eval_job_request_contract.py \
            --contracts-repo BlueprintContracts

      - name: Verify production fail-closed posture
        env:
          BLUEPRINT_LAUNCH_PROOF_MODE: production
          PRIVACY_PIPELINE_ENABLED: "true"
          PRIVACY_FAIL_CLOSED: "true"
          PIPELINE_SYNC_REQUIRED: "true"
          RETRIEVAL_REQUIRE_PRIVACY_SAFE_VIDEO: "true"
        run: |
          uv run python -m pytest -q \
            tests/test_launch_proof_policy.py \
            tests/test_production_runtime_env_guard.py \
            tests/test_deploy_systemd_contract.py \
            tests/test_webapp_sync.py::test_production_sync_is_required_and_disables_placeholder_fallback \
            tests/test_provider_preview_qa.py::test_provider_preview_qa_blocks_raw_bypass_in_production

      - name: Collect full lane
        env:
          BLUEPRINT_FULL_LANE_COLLECTION_MANIFEST: output/ci/full-test-lane-planned.json
          BLUEPRINT_FULL_LANE_EVIDENCE_PHASE: planned
        run: |
          mkdir -p output/ci
          uv run python -m pytest \
            -p blueprint_pipeline.pytest_full_lane_evidence \
            -m "" --collect-only -q \
            > output/ci/full-test-lane-collection.txt

      - name: Run full lane
        env:
          BLUEPRINT_FULL_LANE_COLLECTION_MANIFEST: output/ci/full-test-lane-executed.json
          BLUEPRINT_FULL_LANE_EVIDENCE_PHASE: executed
        run: |
          set -euo pipefail
          uv run scripts/pytest_full.sh \
            -p blueprint_pipeline.pytest_full_lane_evidence \
            --junitxml=output/ci/full-test-lane-junit.xml

      - name: Verify exact full-lane collection
        if: always()
        run: |
          uv run python scripts/verify_full_lane_collection.py \
            --planned output/ci/full-test-lane-planned.json \
            --executed output/ci/full-test-lane-executed.json

      - name: Build fail-closed CPU full-lane evidence
        if: always()
        run: |
          uv run python scripts/build_cpu_full_lane_evidence.py \
            --planned output/ci/full-test-lane-planned.json \
            --executed output/ci/full-test-lane-executed.json \
            --junit output/ci/full-test-lane-junit.xml \
            --repository-sha '${{ github.sha }}' \
            --output output/ci/cpu_full.json

      - name: Upload full lane report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-test-lane-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            output/ci/full-test-lane-collection.txt
            output/ci/full-test-lane-planned.json
            output/ci/full-test-lane-executed.json
            output/ci/full-test-lane-junit.xml
            output/ci/cpu_full.json
