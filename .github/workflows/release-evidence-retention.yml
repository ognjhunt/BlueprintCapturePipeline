name: Release Evidence Retention

on:
  workflow_dispatch:
    inputs:
      repository_sha:
        description: "Exact 40-character release commit SHA."
        required: true
        type: string
      image_digest:
        description: "Exact deployed candidate digest (sha256:...)."
        required: true
        type: string
      release_id:
        description: "Immutable release identifier bound by the signed subject."
        required: true
        type: string
      ci_run_id:
        description: "Successful CI run id for repository_sha."
        required: true
        type: string
      full_test_run_id:
        description: "Successful Full Test Lane run id for repository_sha."
        required: true
        type: string
      codeql_run_id:
        description: "Successful CodeQL run id for repository_sha."
        required: true
        type: string
      signature_run_id:
        description: "Successful external release-signature verification run id."
        required: true
        type: string
      signature_artifact_name:
        description: "Release Signature Verification artifact for repository_sha/image_digest."
        required: true
        type: string

permissions:
  actions: read
  contents: read
  security-events: read
  attestations: read

jobs:
  archive-base-release-evidence:
    name: Immutable BASE release evidence archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.repository_sha }}
      RELEASE_IMAGE_DIGEST: ${{ inputs.image_digest }}
      RELEASE_ID: ${{ inputs.release_id }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      FULL_TEST_RUN_ID: ${{ inputs.full_test_run_id }}
      CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
      SIGNATURE_RUN_ID: ${{ inputs.signature_run_id }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.repository_sha }}
          fetch-depth: 0

      - name: Verify release binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main

      - name: Download SHA-bound CI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
          pattern: "*-${{ inputs.repository_sha }}"
          path: ${{ runner.temp }}/blueprint-ci/retention/ci-artifacts

      - name: Download exact full-test artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.full_test_run_id }}
          name: full-test-lane-${{ inputs.full_test_run_id }}
          path: ${{ runner.temp }}/blueprint-ci/retention/full-test

      - name: Download exact external signature evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signature_run_id }}
          name: ${{ inputs.signature_artifact_name }}
          path: ${{ runner.temp }}/blueprint-ci/retention/signature-evidence

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install frozen archive runtime
        run: |
          uv lock --check
          uv sync --frozen --extra cloud

      - name: Freeze exact release source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blueprint-ci/retention/source"
          source_archive="${{ runner.temp }}/blueprint-ci/retention/source/BlueprintCapturePipeline-${RELEASE_SHA}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="BlueprintCapturePipeline-${RELEASE_SHA}/" \
            "${RELEASE_SHA}" \
            > "${source_archive}"
          sha256sum "${source_archive}" \
            > "${{ runner.temp }}/blueprint-ci/retention/source/SHA256SUMS"

      - name: Collect run metadata and verify conclusions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blueprint-ci/retention/run-evidence"
          uv run python scripts/collect_github_actions_evidence.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${CI_RUN_ID}" \
            --evidence-id pipeline_ci \
            --output "${{ runner.temp }}/blueprint-ci/retention/run-evidence/ci.json"
          uv run python scripts/collect_github_actions_evidence.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${FULL_TEST_RUN_ID}" \
            --evidence-id full_test_lane_ci \
            --junit "${{ runner.temp }}/blueprint-ci/retention/full-test/full-test-lane-junit.xml" \
            --output "${{ runner.temp }}/blueprint-ci/retention/run-evidence/full-test.json"
          uv run python scripts/collect_github_actions_evidence.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${CODEQL_RUN_ID}" \
            --evidence-id codeql_analysis \
            --output "${{ runner.temp }}/blueprint-ci/retention/codeql-evidence/run.json"
          uv run python scripts/collect_github_actions_evidence.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${SIGNATURE_RUN_ID}" \
            --evidence-id artifact_signature \
            --output "${{ runner.temp }}/blueprint-ci/retention/signature-evidence/run.json"
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          run_paths = {
              "ci": Path("${{ runner.temp }}/blueprint-ci/retention/run-evidence/ci.json"),
              "full-test": Path("${{ runner.temp }}/blueprint-ci/retention/run-evidence/full-test.json"),
              "codeql": Path("${{ runner.temp }}/blueprint-ci/retention/codeql-evidence/run.json"),
              "signature": Path("${{ runner.temp }}/blueprint-ci/retention/signature-evidence/run.json"),
          }
          for name, path in run_paths.items():
              payload = json.loads(path.read_text())
              if payload.get("conclusion") != "success":
                  raise SystemExit(f"{name} run did not succeed")
              if payload.get("head_sha") != os.environ["RELEASE_SHA"]:
                  raise SystemExit(f"{name} run belongs to a different SHA")
          expected_workflows = {
              "ci": "CI",
              "full-test": "Full Test Lane",
              "codeql": "CodeQL",
              "signature": "Release Signature Verification",
          }
          for name, workflow_name in expected_workflows.items():
              payload = json.loads(run_paths[name].read_text())
              if payload.get("workflow_name") != workflow_name:
                  raise SystemExit(f"{name} evidence came from the wrong workflow")
          PY

      - name: Cryptographically verify release-command attestation and bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject="${{ runner.temp }}/blueprint-ci/retention/signature-evidence/release-command-attestation-subject.json"
          bundle="${{ runner.temp }}/blueprint-ci/retention/signature-evidence/release-command-attestation-bundle.json"
          if [ ! -f "${bundle}" ]; then
            # actions/attest emits a JSON-serialized Sigstore bundle; accept
            # .json and legacy .jsonl, never the subject itself.
            bundle="$(find "${{ runner.temp }}/blueprint-ci/retention/signature-evidence" -type f \
              \( -name '*.jsonl' -o -name '*.json' \) \
              ! -name 'release-command-attestation-subject.json' -print -quit)"
          fi
          test -f "${subject}"
          test -n "${bundle}"
          test -f "${bundle}"
          gh attestation verify "${subject}" --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}"
          uv run python scripts/validate_release_command_attestation.py \
            --subject "${subject}" --repository-sha "${RELEASE_SHA}" \
            --image-digest "${RELEASE_IMAGE_DIGEST}" --release-id "${RELEASE_ID}" \
            --ci-run-id "${CI_RUN_ID}" --full-test-run-id "${FULL_TEST_RUN_ID}" \
            --codeql-run-id "${CODEQL_RUN_ID}"

      - name: Download exact-commit CodeQL SARIF
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t analysis_ids < <(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/analyses?per_page=100" \
              | jq -r --arg sha "${RELEASE_SHA}" \
                '.[][] | select(.commit_sha == $sha and .tool.name == "CodeQL") | .id'
          )
          test "${#analysis_ids[@]}" -gt 0
          for analysis_id in "${analysis_ids[@]}"; do
            [[ "${analysis_id}" =~ ^[0-9]+$ ]]
            output="${{ runner.temp }}/blueprint-ci/retention/codeql-evidence/analysis-${analysis_id}.sarif"
            gh api \
              -H "Accept: application/sarif+json" \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/analyses/${analysis_id}" \
              > "${output}"
            python -m json.tool "${output}" >/dev/null
          done

      - name: Assemble deterministic BASE evidence bundle
        run: |
          uv run python scripts/build_release_evidence_bundle.py \
            --scope BASE \
            --repository-sha "${RELEASE_SHA}" \
            --image-digest "${RELEASE_IMAGE_DIGEST}" \
            --evidence source="${{ runner.temp }}/blueprint-ci/retention/source" \
            --evidence ci="${{ runner.temp }}/blueprint-ci/retention/run-evidence/ci.json" \
            --evidence full_test="${{ runner.temp }}/blueprint-ci/retention/full-test" \
            --evidence dependency="${{ runner.temp }}/blueprint-ci/retention/ci-artifacts/dependency-security-${RELEASE_SHA}" \
            --evidence sast="${{ runner.temp }}/blueprint-ci/retention/ci-artifacts/sast-${RELEASE_SHA}" \
            --evidence coverage="${{ runner.temp }}/blueprint-ci/retention/ci-artifacts/ci-test-${RELEASE_SHA}" \
            --evidence supply_chain="${{ runner.temp }}/blueprint-ci/retention/ci-artifacts/supply-chain-${RELEASE_SHA}" \
            --evidence codeql="${{ runner.temp }}/blueprint-ci/retention/codeql-evidence" \
            --evidence signature="${{ runner.temp }}/blueprint-ci/retention/signature-evidence" \
            --output "${{ runner.temp }}/blueprint-ci/retention/release-evidence.tar.gz" \
            --manifest "${{ runner.temp }}/blueprint-ci/retention/release-evidence-manifest.json"

      - name: Archive with Object Lock COMPLIANCE and verify readback
        env:
          BLUEPRINT_RELEASE_EVIDENCE_S3_URI: ${{ secrets.BLUEPRINT_RELEASE_EVIDENCE_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BLUEPRINT_RELEASE_EVIDENCE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BLUEPRINT_RELEASE_EVIDENCE_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.BLUEPRINT_RELEASE_EVIDENCE_AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.BLUEPRINT_RELEASE_EVIDENCE_AWS_REGION }}
        run: |
          test -n "${BLUEPRINT_RELEASE_EVIDENCE_S3_URI}"
          uv run python scripts/archive_release_evidence.py \
            --bundle "${{ runner.temp }}/blueprint-ci/retention/release-evidence.tar.gz" \
            --bundle-manifest "${{ runner.temp }}/blueprint-ci/retention/release-evidence-manifest.json" \
            --archive-uri "${BLUEPRINT_RELEASE_EVIDENCE_S3_URI}" \
            --output "${{ runner.temp }}/blueprint-ci/retention/immutable-archive-receipt.json" \
            --envelope-output "${{ runner.temp }}/blueprint-ci/retention/immutable_retention.json"

      - name: Upload retention receipt as transport copy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immutable-release-evidence-receipt-${{ inputs.repository_sha }}
          path: |
            ${{ runner.temp }}/blueprint-ci/retention/release-evidence-manifest.json
            ${{ runner.temp }}/blueprint-ci/retention/immutable-archive-receipt.json
            ${{ runner.temp }}/blueprint-ci/retention/immutable_retention.json
          if-no-files-found: error
          retention-days: 90
