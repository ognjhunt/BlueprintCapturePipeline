name: Measurement Linux Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Install measurement runtimes
        run: |
          uv sync --frozen --extra dev --extra sapien-development --extra exact-geometry-development

      - name: Capture isolated worker diagnostics
        run: |
          uv run python - <<'PY'
          import json
          import runpy
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from blueprint_pipeline.measurement_adapter_execution import (
              _safe_command,
              _safe_environment,
          )

          module = runpy.run_path("tests/test_measurement_adapter_execution.py")
          request = module["_request"]()
          argv, _ = _safe_command(module["_command"]())
          with tempfile.TemporaryDirectory(prefix="blueprint-linux-diagnostic-") as raw:
              root = Path(raw)
              request_path = root / "request.json"
              result_path = root / "result.json"
              request_path.write_text(json.dumps(request, indent=2), encoding="utf-8")
              environment = _safe_environment(root)
              print("parent_python", sys.executable)
              print("worker_argv", argv)
              print(
                  "worker_environment",
                  {key: environment.get(key) for key in sorted(environment)},
              )
              completed = subprocess.run(
                  [*argv, "--request", str(request_path), "--output", str(result_path)],
                  cwd=root,
                  env=environment,
                  stdin=subprocess.DEVNULL,
                  capture_output=True,
                  text=True,
                  timeout=30,
                  check=False,
              )
              print("worker_returncode", completed.returncode)
              print("worker_stdout", completed.stdout)
              print("worker_stderr", completed.stderr)
              print("worker_result_exists", result_path.is_file())
              if result_path.is_file():
                  print("worker_result", result_path.read_text(encoding="utf-8"))
          PY
