  push:
    branches: ["main"]
    paths:
      - "tools/daily_research/**"
      - "tests/test_daily_research_runner.py"
      - "tests/test_daily_research_verification.py"
      - "tests/test_daily_research_inventory.py"
      - "tests/test_daily_research_site_universe.py"
      - "tests/test_daily_research_team_universe.py"
      - "tests/daily_team_evidence_fixture.py"
      - "tests/test_site_universe_export.py"
      - "tests/test_daily_research_site_screen.py"
      - "tests/test_daily_research_site_contact.py"
      - "tests/test_daily_research_contact_lookup.py"
      - "tests/test_daily_research_screen_admission.py"
      - "tests/daily_research_site_screen_fixture.py"
      - "tools/team_universe/**"
      - "tests/test_team_universe*.py"
      - "tests/team_universe_fixture.py"
      - "tools/site_universe/**"
      - "tests/test_daily_research_breadth.py"
      - "tests/test_daily_research_repair_gaps.py"
      - "tests/daily_research_verification_fixture.py"
      - "tests/test_daily_research_agent_history.py"
      - "tests/test_daily_research_agent_publication.py"
      - "tests/test_daily_research_unattended_cleanup.py"
      - "tests/test_daily_research_knowledge.py"
      - "tests/test_daily_research_standalone.py"
      - "tests/test_daily_research_render.py"
      - "tests/test_daily_research_recovery.py"
      - "tests/test_daily_research_consumer.py"
      - "tests/test_daily_research_qa_retry.py"
      - "tests/test_daily_research_adaptive.py"
      - "tests/test_daily_research_adaptive_runtime.py"
      - "tests/test_daily_research_search*.py"
      - "tests/test_daily_research_expansion*.py"
      - "tests/test_daily_research_allocation.py"
      - "tests/test_daily_research_exa_transport.py"
      - "tests/test_daily_research_findall.py"
      - "tests/test_daily_research_findall_observe.py"
      - "tests/test_parallel_findall*.py"
      - "src/blueprint_pipeline/parallel_findall*.py"
      - "src/blueprint_pipeline/paid_resource_admission.py"
      - "src/blueprint_pipeline/safe_outbound_http.py"
      - "tests/test_daily_research_operator*.py"
      - "tests/daily_research_*.test.mjs"
      - "tests/daily_contact_research.test.mjs"
      - "tests/fixtures/daily_research/**"
      - ".github/workflows/daily-research.yml"

permissions:
  contents: read

concurrency:
  group: daily-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-runner:
    name: Research lifecycle and pinned SDK
    runs-on: ubuntu-latest
    # The complete portable suite includes all recovery/collection guards.
    # The 2149-case suite took 10m50s-11m for pytest alone on 3.12/3.14;
    # 3.11 reached 73% before the prior 12-minute job ceiling. Keep complete
    # no-skip coverage, including setup, Node checks, lint and receipt upload,
    # with a bounded allowance for runner variance. Business run limits stay fixed.
    timeout-minutes: 16
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install isolated CPU runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          python-version: ${{ matrix.python }}
      - name: Match existing Render Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install runner and verification tools only
        run: |
          uv venv "${RUNNER_TEMP}/daily-research-venv"
          uv pip install --python "${RUNNER_TEMP}/daily-research-venv/bin/python" -r tools/daily_research/requirements.txt pytest==9.1.1 ruff==0.16.9 jsonschema==4.26.0
      - name: Verify lifecycle, SDK contracts and changed-file lint
        run: |
          node --test tests/daily_research_store.test.mjs tests/daily_research_store_exa_reservation.test.mjs tests/daily_research_worker.test.mjs tests/daily_research_publisher.test.mjs tests/daily_contact_research.test.mjs tests/daily_research_screen_admission.test.mjs tests/daily_research_team_universe.test.mjs tests/daily_research_publication_lap.test.mjs
          "${RUNNER_TEMP}/daily-research-venv/bin/python" -m pytest -q -o addopts= tests/test_daily_research_verification.py tests/test_daily_research_inventory.py tests/test_daily_research_site_universe.py tests/test_site_universe_export.py tests/test_daily_research_breadth.py tests/test_daily_research_repair_gaps.py tests/test_daily_research_agent_history.py tests/test_daily_research_agent_publication.py tests/test_daily_research_unattended_cleanup.py tests/test_daily_research_runner.py tests/test_daily_research_knowledge.py tests/test_daily_research_standalone.py tests/test_daily_research_render.py tests/test_daily_research_recovery.py tests/test_daily_research_consumer.py tests/test_daily_research_qa_retry.py tests/test_daily_research_adaptive.py tests/test_daily_research_adaptive_runtime.py tests/test_daily_research_search.py tests/test_daily_research_expansion.py tests/test_daily_research_expansion_integration.py tests/test_daily_research_allocation.py tests/test_daily_research_exa_transport.py tests/test_daily_research_findall.py tests/test_daily_research_findall_observe.py tests/test_parallel_findall.py tests/test_parallel_findall_execution.py tests/test_parallel_findall_owner.py tests/test_parallel_findall_admission.py tests/test_daily_research_search_adapter.py tests/test_daily_research_operator*.py tests/test_daily_research_site_screen.py tests/test_daily_research_site_contact.py tests/test_daily_research_screen_admission.py tests/test_daily_research_contact_lookup.py tests/test_team_universe.py tests/test_team_universe_rank.py tests/test_team_universe_qualification.py tests/test_team_universe_evidence_export.py tests/test_daily_research_team_universe.py --junitxml="${RUNNER_TEMP}/daily-research-tests.xml"
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/findall.py src/blueprint_pipeline/parallel_findall.py src/blueprint_pipeline/parallel_findall_execution.py src/blueprint_pipeline/parallel_findall_owner.py src/blueprint_pipeline/parallel_findall_admission.py tests/test_daily_research_findall.py tests/test_parallel_findall_owner.py tests/test_parallel_findall_admission.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/allocation.py tools/daily_research/expansion.py tools/daily_research/exa_transport.py tools/daily_research/qa_retry.py tests/test_daily_research_allocation.py tests/test_daily_research_qa_retry.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/recovery.py tests/test_daily_research_recovery.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/site_universe.py tests/test_daily_research_site_universe.py tools/site_universe/export.py tools/site_universe/cli.py tools/site_universe/rank.py tests/test_site_universe_export.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/operators/*.py tests/test_daily_research_operator*.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/site_screen.py tests/test_daily_research_site_screen.py tests/test_daily_research_site_contact.py tests/daily_research_site_screen_fixture.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/screen_admission.py tests/test_daily_research_screen_admission.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/contact_lookup.py tests/test_daily_research_contact_lookup.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/team_universe/*.py tests/test_team_universe.py tests/test_team_universe_rank.py tests/test_team_universe_qualification.py tests/test_team_universe_evidence_export.py tests/team_universe_fixture.py
          "${RUNNER_TEMP}/daily-research-venv/bin/ruff" check tools/daily_research/team_universe.py tests/test_daily_research_team_universe.py tests/daily_team_evidence_fixture.py tools/daily_research/verification.py tools/daily_research/outreach_ready.py tools/daily_research/publication.py tools/daily_research/history.py tests/test_daily_research_verification.py tests/test_daily_research_inventory.py tests/test_daily_research_breadth.py tests/test_daily_research_repair_gaps.py tests/test_daily_research_agent_history.py tests/test_daily_research_agent_publication.py tests/test_daily_research_unattended_cleanup.py tests/daily_research_verification_fixture.py tools/daily_research/adaptive.py tools/daily_research/adaptive_runtime.py tools/daily_research/discovery.py tools/daily_research/capabilities.py tools/daily_research/consumer.py tools/daily_research/runner.py tools/daily_research/knowledge.py tools/daily_research/contracts.py tools/daily_research/freshness.py tools/daily_research/standalone.py tools/daily_research/firestore.py tools/daily_research/render.py tests/test_daily_research_runner.py tests/test_daily_research_knowledge.py tests/test_daily_research_standalone.py tests/test_daily_research_render.py tests/test_daily_research_consumer.py tests/test_daily_research_adaptive.py tests/test_daily_research_adaptive_runtime.py tools/daily_research/search.py tests/test_daily_research_search.py tests/test_daily_research_expansion.py tests/test_daily_research_expansion_integration.py tests/test_daily_research_exa_transport.py tests/test_daily_research_findall.py tests/test_daily_research_search_adapter.py
          python3 - "${RUNNER_TEMP}/daily-research-tests.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          assert cases, "runner verification must execute"
          assert not any(case.find(tag) is not None for case in cases for tag in ("skipped", "error", "failure")), "SDK/lifecycle skips do not prove verification"
          PYTHON
      - name: Preserve test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-research-tests-${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/daily-research-tests.xml
          if-no-files-found: error
          retention-days: 7
