name: CodeQL

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "31 7 * * 2"
  # Release evidence needs a successful run for its exact commit. A superseded
  # main commit can still get one: tag it and dispatch this workflow on the tag.
  workflow_dispatch:

# Only the newest main commit needs an automatic analysis, and no merge or deploy
# waits for it: at about 44 runner-minutes a run it held slots that main's
# attestation waited for.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Python security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: /language:python
