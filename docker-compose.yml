# Local development and container smoke configuration. Production deployment
# uses immutable image digests and its own secret/network policy.

services:
  pipeline:
    build:
      context: .
      target: production
    volumes:
      - ./configs:/workspace/configs:ro
      - ./data:/workspace/data:ro
      - ./output:/workspace/output
    environment:
      PYTHONUNBUFFERED: "1"
      BLUEPRINT_ENV: development
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pipeline-gpu:
    build:
      context: .
      target: production
    volumes:
      - ./configs:/workspace/configs:ro
      - ./data:/workspace/data:ro
      - ./output:/workspace/output
    environment:
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      BLUEPRINT_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  dev:
    build:
      context: .
      target: development
    volumes:
      - ./:/app
      - ./data:/workspace/data:ro
      - ./output:/workspace/output
    environment:
      PYTHONUNBUFFERED: "1"
      BLUEPRINT_ENV: development
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
